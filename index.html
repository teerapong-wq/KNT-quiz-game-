<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Quiz App - Kahoot Style with Realtime Firebase</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Firebase Web SDK v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Kanit', sans-serif;
            user-select: none;
        }
        .animate-bounce-short {
            animation: bounce 0.5s ease-in-out 2;
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, Component } = React;

        // 📌 ค่า FIREBASE DATABASE URL หลัก
        const DEFAULT_FB_URL = "https://knt-quiz-default-rtdb.asia-southeast1.firebasedatabase.app";
        
        // Firebase Web API Key (เว้นว่างไว้หากใช้ Rules แบบเปิดสิทธิ์)
        const DEFAULT_API_KEY = "";

        // รหัสผ่านเข้าสู่ระบบ Admin
        const ADMIN_PASSCODE = "QCKNT10520";

        // Google Apps Script URL สำหรับสร้างไฟล์ Google Sheet
        const DEFAULT_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw-5N50clAOoW-CPQAW90UlKgmq0_9VFMZEoTb6HQrmeTAtSWTXLBJIwhf96g6t5uxc/exec";

        // คลังชุดคำถามเริ่มต้นสำรอง
        const DEFAULT_QUIZZES = [
            {
                id: 'default-1',
                title: 'ความรู้ทั่วไปองค์กร & ความปลอดภัย',
                description: 'ทดสอบความเข้าใจนโยบายบริษัทและการทำงานปลอดภัย',
                questions: [
                    {
                        id: 'q1',
                        questionText: 'วิสัยทัศน์และ Vision ของบริษัทเราเน้นเรื่องใดเป็นสำคัญที่สุด?',
                        options: ['กำไรสูงสุด', 'นวัตกรรมและความยั่งยืน', 'ขยายสาขาต่างประเทศ', 'ลดต้นทุนผลิต'],
                        correctOption: 1,
                        timeLimit: 20,
                        points: 1000
                    },
                    {
                        id: 'q2',
                        questionText: 'เบอร์โทรศัพท์ฉุกเฉินสำหรับแจ้งเหตุภายในออฟฟิศคือเบอร์อะไร?',
                        options: ['กด 0', 'กด 100', 'กด 999', 'กด 1193'],
                        correctOption: 2,
                        timeLimit: 15,
                        points: 1000
                    },
                    {
                        id: 'q3',
                        questionText: 'เมื่อเกิดสัญญาณเตือนภัยไหม้ สิ่งแรกที่ต้องทำคืออะไร?',
                        options: ['เก็บของส่วนตัวใส่กระเป๋า', 'เดินลงทางบันไดหนีไฟทันที', 'กดลิฟต์ลงชั้น 1', 'นั่งรอฟังประกาศต่อ'],
                        correctOption: 1,
                        timeLimit: 15,
                        points: 1000
                    }
                ]
            }
        ];

        // ฟังก์ชันตรวจเช็กและซ่อมแซมโครงสร้างชุดคำถามให้สมบูรณ์ 100% ป้องกัน .length error
        const sanitizeQuizzes = (raw) => {
            if (!raw) return DEFAULT_QUIZZES;
            let list = [];
            if (Array.isArray(raw)) {
                list = raw;
            } else if (typeof raw === 'object') {
                list = Object.values(raw);
            }
            if (!list || list.length === 0) return DEFAULT_QUIZZES;

            return list.map((q, qIdx) => {
                const rawQuestions = Array.isArray(q?.questions) 
                    ? q.questions 
                    : (q?.questions && typeof q.questions === 'object' ? Object.values(q.questions) : []);
                
                const cleanQuestions = rawQuestions.map((item, itemIdx) => ({
                    id: item?.id || `q-${Date.now()}-${itemIdx}`,
                    questionText: item?.questionText || item?.question || `คำถามข้อที่ ${itemIdx + 1}`,
                    options: Array.isArray(item?.options) && item.options.length > 0 
                        ? item.options.map(o => String(o)) 
                        : (item?.options && typeof item.options === 'object' 
                            ? Object.values(item.options).map(o => String(o)) 
                            : ['ตัวเลือก 1', 'ตัวเลือก 2', 'ตัวเลือก 3', 'ตัวเลือก 4']),
                    correctOption: typeof item?.correctOption === 'number' ? item.correctOption : 0,
                    timeLimit: Number(item?.timeLimit) || 20,
                    points: Number(item?.points) || 1000
                }));

                return {
                    id: q?.id || `quiz-${Date.now()}-${qIdx}`,
                    title: q?.title || `ชุดคำถามที่ ${qIdx + 1}`,
                    description: q?.description || '',
                    questions: cleanQuestions
                };
            });
        };

        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'click') {
                    osc.frequency.setValueAtTime(400, ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.1);
                } else if (type === 'correct') {
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
                    osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, ctx.currentTime);
                    osc.frequency.setValueAtTime(150, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'count') {
                    osc.frequency.setValueAtTime(800, ctx.currentTime);
                    gain.gain.setValueAtTime(0.05, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.08);
                }
            } catch(e) {
                console.log("Audio play error", e);
            }
        };

        class ErrorBoundary extends Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            componentDidCatch(error, errorInfo) {
                console.error("ErrorBoundary caught an error:", error, errorInfo);
            }
            handleReset() {
                try {
                    localStorage.removeItem('company_kahoot_quizzes');
                    localStorage.removeItem('kahoot_google_script_url');
                } catch(e) {}
                window.location.reload();
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen bg-slate-900 text-white flex items-center justify-center p-4">
                            <div className="bg-slate-800 border border-red-500/50 rounded-3xl p-8 max-w-md w-full text-center space-y-4 shadow-2xl">
                                <div className="text-5xl">⚠️</div>
                                <h2 className="text-xl font-bold text-red-400">ตรวจพบข้อมูลแคชค้างในเบราว์เซอร์</h2>
                                <p className="text-slate-300 text-xs leading-relaxed">
                                    ตรวจพบโครงสร้างชุดคำถามรูปแบบเก่าค้างอยู่ในเครื่อง ({this.state.error?.message || 'Data format error'})
                                </p>
                                <button 
                                    onClick={this.handleReset}
                                    className="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 rounded-xl text-sm transition shadow-lg">
                                    🔄 ล้างแคชและโหลดหน้าเว็บใหม่
                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        function App() {
            const [view, setView] = useState('HOME');
            
            // ดึงข้อมูลคำถามจาก LocalStorage พร้อมผ่านตัวกรอง Sanitizer
            const [quizzes, setQuizzes] = useState(() => {
                try {
                    const saved = localStorage.getItem('company_kahoot_quizzes');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        return sanitizeQuizzes(parsed);
                    }
                } catch(e) {
                    console.warn("Storage load error:", e);
                }
                return DEFAULT_QUIZZES;
            });

            // Toast / Modal Notification States
            const [toastMessage, setToastMessage] = useState(null);
            const [confirmModal, setConfirmModal] = useState(null);
            const [showImportModal, setShowImportModal] = useState(false);
            const [importJsonText, setImportJsonText] = useState('');
            const [firebasePermissionError, setFirebasePermissionError] = useState(false);

            const showToast = (msg, type = 'info') => {
                setToastMessage({ msg, type });
                setTimeout(() => setToastMessage(null), 3500);
            };

            const dbRef = useRef(null);

            // Admin Auth State
            const [isAdminAuth, setIsAdminAuth] = useState(false);
            const [passcodeInput, setPasscodeInput] = useState('');
            const [passcodeError, setPasscodeError] = useState('');

            // Google Script URL
            const [googleScriptUrl, setGoogleScriptUrl] = useState(() => {
                return localStorage.getItem('kahoot_google_script_url') || DEFAULT_SCRIPT_URL;
            });

            useEffect(() => {
                if (!window.firebase) return;
                try {
                    const cleanUrl = DEFAULT_FB_URL.trim().replace(/\/+$/, "");
                    let app;
                    const fbConfig = { databaseURL: cleanUrl };
                    if (DEFAULT_API_KEY && DEFAULT_API_KEY.trim()) {
                        fbConfig.apiKey = DEFAULT_API_KEY.trim();
                    }
                    if (!firebase.apps.length) {
                        app = firebase.initializeApp(fbConfig);
                    } else {
                        app = firebase.app();
                    }
                    dbRef.current = firebase.database(app);

                    // 🔄 ซิงค์ชุดคำถาม Real-time จาก Firebase
                    const quizzesRef = dbRef.current.ref('quizzes');
                    quizzesRef.on('value', (snapshot) => {
                        setFirebasePermissionError(false);
                        const data = snapshot.val();
                        if (data) {
                            const clean = sanitizeQuizzes(data);
                            setQuizzes(clean);
                            localStorage.setItem('company_kahoot_quizzes', JSON.stringify(clean));
                        }
                    }, (err) => {
                        if (err && err.code === 'PERMISSION_DENIED') {
                            setFirebasePermissionError(true);
                        }
                    });
                } catch (err) {
                    console.error("Firebase init error:", err);
                }
            }, []);

            const syncQuizzesToCloud = (updatedList) => {
                const clean = sanitizeQuizzes(updatedList);
                setQuizzes(clean);
                localStorage.setItem('company_kahoot_quizzes', JSON.stringify(clean));
                if (dbRef.current) {
                    dbRef.current.ref('quizzes').set(clean)
                        .then(() => setFirebasePermissionError(false))
                        .catch(err => {
                            console.error("Cloud sync error:", err);
                            if (err && err.code === 'PERMISSION_DENIED') {
                                setFirebasePermissionError(true);
                            }
                        });
                }
            };

            const [activeQuiz, setActiveQuiz] = useState(null);
            const [quizMode, setQuizMode] = useState('POST_TEST'); 
            const [editingQuiz, setEditingQuiz] = useState(null);
            const [pinCode, setPinCode] = useState('');
            const [players, setPlayers] = useState([]);
            const [gameState, setGameState] = useState('LOBBY');
            const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
            const [currentQuestionData, setCurrentQuestionData] = useState(null);
            const [timeLeft, setTimeLeft] = useState(20);
            const [autoNextTime, setAutoNextTime] = useState(5);
            const [isSavingResults, setIsSavingResults] = useState(false);
            const [saveResultsMessage, setSaveResultsMessage] = useState('');

            // Player State
            const [playerName, setPlayerName] = useState('');
            const [joinedPin, setJoinedPin] = useState('');
            const [myPlayerId, setMyPlayerId] = useState('');
            const [hasAnswered, setHasAnswered] = useState(false);
            const [selectedOption, setSelectedOption] = useState(null);

            useEffect(() => {
                const activePin = pinCode || joinedPin;
                if (activePin && dbRef.current) {
                    const playersRef = dbRef.current.ref('rooms/' + activePin + '/players');
                    
                    const handlePlayers = (snapshot) => {
                        const data = snapshot.val();
                        if (data) {
                            const playerList = Object.keys(data).map(id => ({
                                id: id,
                                ...data[id]
                            }));
                            setPlayers(playerList);
                        } else {
                            setPlayers([]);
                        }
                    };

                    playersRef.on('value', handlePlayers);
                    return () => playersRef.off('value', handlePlayers);
                }
            }, [view, pinCode, joinedPin]);

            useEffect(() => {
                if (joinedPin && dbRef.current) {
                    const roomRef = dbRef.current.ref('rooms/' + joinedPin);
                    const handleRoomUpdate = (snapshot) => {
                        const data = snapshot.val();
                        if (data) {
                            if (data.gameState) setGameState(data.gameState);
                            if (data.currentQuestionIndex !== undefined) {
                                setCurrentQuestionIndex(data.currentQuestionIndex);
                            }
                            if (data.timeLeft !== undefined) setTimeLeft(data.timeLeft);
                            if (data.autoNextTime !== undefined) setAutoNextTime(data.autoNextTime);
                            if (data.currentQuestion) {
                                setCurrentQuestionData(data.currentQuestion);
                            }
                        }
                    };
                    roomRef.on('value', handleRoomUpdate);
                    return () => roomRef.off('value', handleRoomUpdate);
                }
            }, [view, joinedPin]);

            useEffect(() => {
                if (gameState === 'QUESTION') {
                    setHasAnswered(false);
                    setSelectedOption(null);
                }
            }, [currentQuestionIndex, gameState]);

            const syncRoomStateToFirebase = (newState, questionIdx, timerSecs, autoNextSecs = 5, customQuestion = null) => {
                if (!pinCode || !dbRef.current) return;
                const currentQ = customQuestion || activeQuiz?.questions?.[questionIdx];
                const payload = {
                    gameState: newState,
                    currentQuestionIndex: questionIdx,
                    timeLeft: timerSecs,
                    autoNextTime: autoNextSecs,
                    currentQuestion: currentQ ? {
                        questionText: currentQ.questionText,
                        options: currentQ.options
                    } : null
                };
                dbRef.current.ref('rooms/' + pinCode).update(payload);
            };

            const handleSaveResultsToGoogleDrive = async (overridePlayers = null) => {
                if (!googleScriptUrl || !activeQuiz) return;
                setIsSavingResults(true);
                setSaveResultsMessage('⏳ กำลังสร้างไฟล์ Google Sheet สรุปผลคะแนนลง Google Drive...');
                try {
                    const targetPlayers = overridePlayers || players;
                    const modeTitle = quizMode === 'PRE_TEST' ? 'ก่อนอบรม' : 'หลังอบรม';
                    const payload = {
                        action: 'SAVE_RESULTS',
                        quizTitle: `${activeQuiz.title}_(${modeTitle})`,
                        questions: activeQuiz.questions || [],
                        players: targetPlayers.map(p => ({
                            name: p.name,
                            score: p.score || 0,
                            playerAnswers: p.answersHistory || {}
                        }))
                    };
                    await fetch(googleScriptUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    setSaveResultsMessage('✅ บันทึกสรุปผลเป็น Google Sheet ลง Google Drive เรียบร้อยแล้ว!');
                } catch (err) {
                    setSaveResultsMessage('❌ ไม่สามารถบันทึกสรุปผลลง Google Drive ได้');
                } finally {
                    setIsSavingResults(false);
                }
            };

            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (passcodeInput.trim() === ADMIN_PASSCODE.trim()) {
                    setIsAdminAuth(true);
                    setPasscodeError('');
                    setView('ADMIN_QUIZ_LIST');
                    playSound('correct');

                    if (window.firebase && firebase.auth && DEFAULT_API_KEY && DEFAULT_API_KEY.trim()) {
                        try {
                            firebase.auth().signInAnonymously().catch(err => {
                                console.warn("Firebase Auth Notice:", err);
                                if (err.code === 'auth/operation-not-allowed' || err.code === 'auth/admin-restricted-operation' || err.code === 'auth/invalid-api-key') {
                                    setFirebasePermissionError(true);
                                }
                            });
                        } catch (authErr) {
                            console.warn("Auth initialization error:", authErr);
                        }
                    }
                } else {
                    setPasscodeError('รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง');
                    playSound('wrong');
                }
            };

            const handleLogoutAdmin = () => {
                setIsAdminAuth(false);
                setPasscodeInput('');
                setView('HOME');
                if (window.firebase && firebase.auth && DEFAULT_API_KEY && DEFAULT_API_KEY.trim()) {
                    try {
                        if (firebase.auth().currentUser) {
                            firebase.auth().signOut().catch(e => console.log(e));
                        }
                    } catch (e) {}
                }
            };

            const handleCreateNewQuiz = () => {
                const newQ = {
                    id: 'quiz-' + Date.now(),
                    title: 'ชุดคำถามใหม่ (ยังไม่ได้ตั้งชื่อ)',
                    description: 'คำอธิบายชุดคำถาม...',
                    questions: []
                };
                const updatedList = [...quizzes, newQ];
                syncQuizzesToCloud(updatedList);
                setEditingQuiz(newQ);
                setView('ADMIN_QUIZ_EDIT');
                showToast('สร้างชุดคำถามใหม่แล้ว', 'success');
            };

            const handleDeleteQuiz = (id) => {
                setConfirmModal({
                    message: 'คุณแน่ใจหรือไม่ว่าต้องการลบชุดคำถามนี้?',
                    onConfirm: () => {
                        const updated = quizzes.filter(q => q.id !== id);
                        syncQuizzesToCloud(updated);
                        showToast('ลบชุดคำถามเรียบร้อยแล้ว', 'info');
                        setConfirmModal(null);
                    }
                });
            };

            const handleExportBackup = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(quizzes, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", `kahoot_quizzes_backup_${Date.now()}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            };

            const processAndImportQuizzes = (rawInput) => {
                const text = (rawInput || importJsonText || '').trim();
                if (!text) {
                    showToast('⚠️ กรุณาระบุหรือเลือกไฟล์ JSON ก่อน', 'error');
                    return;
                }
                try {
                    let cleanText = text;
                    cleanText = cleanText.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '').trim();
                    cleanText = cleanText.replace(/[\u201C\u201D]/g, '"').replace(/[\u2018\u2019]/g, "'");

                    let parsed;
                    try {
                        parsed = JSON.parse(cleanText);
                    } catch (parseErr) {
                        const relaxedText = cleanText.replace(/,\s*([\]}])/g, '$1');
                        parsed = JSON.parse(relaxedText);
                    }

                    let extracted = null;
                    if (Array.isArray(parsed)) {
                        if (parsed.length > 0 && (parsed[0].questionText || parsed[0].options)) {
                            extracted = [{
                                id: 'quiz-' + Date.now(),
                                title: 'ชุดคำถามนำเข้า (' + new Date().toLocaleDateString('th-TH') + ')',
                                description: 'นำเข้าจากรายการข้อคำถาม',
                                questions: parsed
                            }];
                        } else {
                            extracted = parsed;
                        }
                    } else if (parsed && typeof parsed === 'object') {
                        if (Array.isArray(parsed.quizzes)) {
                            extracted = parsed.quizzes;
                        } else if (Array.isArray(parsed.quizzes_data)) {
                            extracted = parsed.quizzes_data;
                        } else if (Array.isArray(parsed.data)) {
                            extracted = parsed.data;
                        } else if (parsed.questions && Array.isArray(parsed.questions)) {
                            extracted = [parsed];
                        }
                    }

                    const normalized = sanitizeQuizzes(extracted);
                    syncQuizzesToCloud(normalized);
                    setShowImportModal(false);
                    setImportJsonText('');
                    const totalQuestions = normalized.reduce((acc, q) => acc + (q.questions || []).length, 0);
                    showToast(`✅ นำเข้าสำเร็จ ${normalized.length} ชุดคำถาม (${totalQuestions} ข้อ) แล้ว!`, 'success');
                    playSound('correct');
                } catch (err) {
                    console.error("JSON Parse Error:", err);
                    showToast(`⚠️ เกิดข้อผิดพลาดในการอ่าน JSON: ${err.message}`, 'error');
                    playSound('wrong');
                }
            };

            const handleAddQuestion = () => {
                if (!editingQuiz) return;
                const newQuestion = {
                    id: 'q-' + Date.now(),
                    questionText: 'คำถามข้อใหม่...',
                    options: ['ตัวเลือก A', 'ตัวเลือก B', 'ตัวเลือก C', 'ตัวเลือก D'],
                    correctOption: 0,
                    timeLimit: 20,
                    points: 1000
                };
                const updated = {
                    ...editingQuiz,
                    questions: [...(editingQuiz.questions || []), newQuestion]
                };
                setEditingQuiz(updated);
                const updatedAll = quizzes.map(q => q.id === updated.id ? updated : q);
                syncQuizzesToCloud(updatedAll);
            };

            const handleUpdateQuestion = (qIndex, field, value) => {
                if (!editingQuiz) return;
                const updatedQuestions = [...(editingQuiz.questions || [])];
                updatedQuestions[qIndex] = {
                    ...updatedQuestions[qIndex],
                    [field]: value
                };
                const updatedQuiz = { ...editingQuiz, questions: updatedQuestions };
                setEditingQuiz(updatedQuiz);
                const updatedAll = quizzes.map(q => q.id === updatedQuiz.id ? updatedQuiz : q);
                syncQuizzesToCloud(updatedAll);
            };

            const handleUpdateOption = (qIndex, optIndex, value) => {
                if (!editingQuiz) return;
                const updatedQuestions = [...(editingQuiz.questions || [])];
                const newOptions = [...(updatedQuestions[qIndex]?.options || [])];
                newOptions[optIndex] = value;
                updatedQuestions[qIndex].options = newOptions;

                const updatedQuiz = { ...editingQuiz, questions: updatedQuestions };
                setEditingQuiz(updatedQuiz);
                const updatedAll = quizzes.map(q => q.id === updatedQuiz.id ? updatedQuiz : q);
                syncQuizzesToCloud(updatedAll);
            };

            const handleDeleteQuestion = (qIndex) => {
                if (!editingQuiz) return;
                setConfirmModal({
                    message: 'ยืนยันลบข้อคำถามนี้?',
                    onConfirm: () => {
                        const updatedQuestions = (editingQuiz.questions || []).filter((_, idx) => idx !== qIndex);
                        const updatedQuiz = { ...editingQuiz, questions: updatedQuestions };
                        setEditingQuiz(updatedQuiz);
                        const updatedAll = quizzes.map(q => q.id === updatedQuiz.id ? updatedQuiz : q);
                        syncQuizzesToCloud(updatedAll);
                        setConfirmModal(null);
                        showToast('ลบข้อคำถามเรียบร้อยแล้ว', 'info');
                    }
                });
            };

            const startHostLobby = (quiz, mode = 'POST_TEST') => {
                const cleanQ = sanitizeQuizzes([quiz])[0];
                const randomPin = Math.floor(100000 + Math.random() * 900000).toString();
                setActiveQuiz(cleanQ);
                setQuizMode(mode);
                setPinCode(randomPin);
                setPlayers([]);
                setGameState('LOBBY');
                setView('HOST_LOBBY');

                if (dbRef.current) {
                    dbRef.current.ref('rooms/' + randomPin).set({
                        gameState: 'LOBBY',
                        currentQuestionIndex: 0,
                        timeLeft: 20,
                        quizTitle: cleanQ.title,
                        quizMode: mode
                    });
                }
            };

            const startFirstQuestion = () => {
                if (!activeQuiz || !activeQuiz.questions || activeQuiz.questions.length === 0) {
                    showToast('⚠️ ชุดคำถามนี้ยังไม่มีข้อคำถาม กรุณาเพิ่มคำถามก่อนเริ่มเล่น', 'error');
                    return;
                }
                setCurrentQuestionIndex(0);
                setGameState('QUESTION');
                setView('HOST_GAME');
                const t = activeQuiz.questions[0]?.timeLimit || 20;
                setTimeLeft(t);
                syncRoomStateToFirebase('QUESTION', 0, t, 5);
            };

            useEffect(() => {
                let timerInterval = null;
                let autoNextInterval = null;

                if (view === 'HOST_GAME' && gameState === 'QUESTION') {
                    timerInterval = setInterval(() => {
                        setTimeLeft(prev => {
                            if (prev <= 1) {
                                clearInterval(timerInterval);
                                evaluateCurrentQuestion();
                                return 0;
                            }
                            const nextT = prev - 1;
                            playSound('count');
                            syncRoomStateToFirebase('QUESTION', currentQuestionIndex, nextT, 5);
                            return nextT;
                        });
                    }, 1000);
                } else if (view === 'HOST_GAME' && gameState === 'RESULT') {
                    setAutoNextTime(5);
                    autoNextInterval = setInterval(() => {
                        setAutoNextTime(prev => {
                            if (prev <= 1) {
                                clearInterval(autoNextInterval);
                                goToNextQuestion();
                                return 0;
                            }
                            const nextAuto = prev - 1;
                            syncRoomStateToFirebase('RESULT', currentQuestionIndex, 0, nextAuto);
                            return nextAuto;
                        });
                    }, 1000);
                }

                return () => {
                    if (timerInterval) clearInterval(timerInterval);
                    if (autoNextInterval) clearInterval(autoNextInterval);
                };
            }, [view, gameState, currentQuestionIndex]);

            const evaluateCurrentQuestion = () => {
                setGameState('RESULT');
                setAutoNextTime(5);
                
                if (!pinCode || !dbRef.current || !activeQuiz) return;
                const currentQ = activeQuiz.questions?.[currentQuestionIndex];
                if (!currentQ) return;

                dbRef.current.ref('rooms/' + pinCode + '/players').once('value', (snapshot) => {
                    const data = snapshot.val();
                    if (!data) return;

                    Object.keys(data).forEach(id => {
                        const p = data[id];
                        let earned = 0;
                        
                        if (p.lastAnswer !== null && p.lastAnswer !== undefined && Number(p.lastAnswer) === Number(currentQ.correctOption)) {
                            const remTime = p.answerTime !== undefined && p.answerTime !== null ? Number(p.answerTime) : 1;
                            const totalLimit = Number(currentQ.timeLimit) || 20;
                            const timeRatio = Math.min(1, Math.max(0.1, remTime / totalLimit));
                            earned = Math.round((Number(currentQ.points) || 1000) * timeRatio);
                        }
                        
                        const newScore = (Number(p.score) || 0) + earned;

                        dbRef.current.ref('rooms/' + pinCode + '/players/' + id).update({
                            score: newScore,
                            lastEarned: earned
                        });
                    });
                });

                syncRoomStateToFirebase('RESULT', currentQuestionIndex, 0, 5);
            };

            const goToNextQuestion = () => {
                if (currentQuestionIndex + 1 < (activeQuiz?.questions?.length || 0)) {
                    const nextIdx = currentQuestionIndex + 1;
                    setCurrentQuestionIndex(nextIdx);
                    
                    if (dbRef.current && pinCode) {
                        dbRef.current.ref('rooms/' + pinCode + '/players').once('value', (snapshot) => {
                            const data = snapshot.val();
                            if (data) {
                                Object.keys(data).forEach(id => {
                                    dbRef.current.ref('rooms/' + pinCode + '/players/' + id).update({
                                        lastAnswer: null,
                                        answerTime: 0
                                    });
                                });
                            }
                        });
                    }

                    setGameState('QUESTION');
                    const t = activeQuiz.questions[nextIdx]?.timeLimit || 20;
                    setTimeLeft(t);
                    syncRoomStateToFirebase('QUESTION', nextIdx, t, 5);
                } else {
                    setGameState('FINISHED');
                    syncRoomStateToFirebase('FINISHED', currentQuestionIndex, 0, 0);
                    confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
                    setTimeout(() => {

            const handlePlayerJoin = (e) => {
                e.preventDefault();

                if (!dbRef.current && window.firebase) {
                    try {
                        const cleanUrl = DEFAULT_FB_URL.trim().replace(/\/+$/, "");

                        dbRef.current = firebase.database(app);

                        console.error(err);
                    }

                if (!dbRef.current) {
                    return showToast('❌ ไม่สามารถเชื่อมต่อระบบ Realtime Database ได้', 'error');
                }

                                        {hasAnswered && (
                                            <div className="bg-purple-950/80 border border-purple-500/50 text-purple-200 text-xs p-3 rounded-xl text-center font-bold animate-pulse">
                                                🔒 ล็อกคำตอบเรียบร้อยแล้ว! กรุณารอตารางคะแนนบนหน้าจอใหญ่...
                                            </div>
                                        )}
                                    </div>
                                )}

                                {gameState === 'RESULT' && (
                                    <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 text-center space-y-4 shadow-xl">
                                        <h3 className="text-lg font-bold text-yellow-400">📊 ตารางสรุปคะแนนข้อนี้</h3>
                                        <div className="text-xs text-slate-400">เริ่มข้อถัดไปใน {autoNextTime} วินาที...</div>

                                        <div className="space-y-2 max-h-60 overflow-y-auto pt-2">
                                            {players.sort((a,b) => (b.score || 0) - (a.score || 0)).map((p, idx) => (
                                                <div key={p.id} className={`flex justify-between items-center p-3 rounded-xl text-xs font-bold ${
                                                    p.id === myPlayerId ? 'bg-purple-900/60 border border-purple-500/50 text-white' : 'bg-slate-900 text-slate-300'
                                                }`}>
                                                    <span>#{idx+1} {p.name} {p.id === myPlayerId ? '(คุณ)' : ''}</span>
                                                    <span className="text-yellow-400">{p.score || 0} คะแนน</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {gameState === 'FINISHED' && (
                                    <div className="bg-slate-800 p-8 rounded-3xl border border-yellow-500/40 text-center space-y-4 shadow-xl">
                                        <div className="text-5xl">🏆</div>
                                        <h3 className="text-2xl font-black text-yellow-400">จบการแข่งขัน!</h3>
                                        <p className="text-sm text-slate-300">ขอบคุณสำหรับการเข้าร่วมกิจกรรมในครั้งนี้</p>
                                    </div>
                                )}
                            </div>
                        )}

                    </main>

                    {}
                    {/* Import JSON Modal */}
                    {showImportModal && (
                        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-slate-800 border border-slate-700 rounded-2xl max-w-lg w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center border-b border-slate-700 pb-3">
                                    <h3 className="text-lg font-bold text-purple-300">📤 นำเข้าคลังคำถาม (Import JSON)</h3>
                                    <button 
                                        onClick={() => setShowImportModal(false)}
                                        className="text-slate-400 hover:text-white text-lg px-2">
                                        ✕
                                    </button>
                                </div>

                                <div className="bg-slate-900/80 border-2 border-dashed border-purple-500/40 hover:border-purple-400 rounded-xl p-4 text-center transition">
                                    <label className="cursor-pointer block">
                                        <div className="text-3xl mb-1">📁</div>
                                        <span className="text-xs font-bold text-purple-300 block">คลิกเพื่อเลือกไฟล์ .json จากเครื่อง</span>
                                        <span className="text-[11px] text-slate-400">เลือกไฟล์สำรองข้อมูลเพื่อนำเข้าทันที (ไม่ต้องก๊อปปี้ข้อความ)</span>
                                        <input 
                                            type="file" 
                                            accept=".json,application/json,text/plain" 
                                            className="hidden" 
                                            onChange={(e) => {
                                                const file = e.target.files && e.target.files[0];
                                                if (file) {
                                                    const reader = new FileReader();
                                                    reader.onload = (event) => {
                                                        const content = event.target.result;
                                                        setImportJsonText(content);
                                                        processAndImportQuizzes(content);
                                                    };
                                                    reader.readAsText(file);
                                                }
                                            }}
                                        />
                                    </label>
                                </div>

                                <div className="text-center text-xs text-slate-500 font-semibold">— หรือ วางโค้ด JSON ลงในช่องด้านล่าง —</div>

                                <textarea 
                                    value={importJsonText}
                                    onChange={(e) => setImportJsonText(e.target.value)}
                                    rows={6}
                                    placeholder="วางโค้ด JSON ที่นี่ (รองรับทั้งไฟล์ Export เดิม, ไฟล์จาก Firebase หรือโครงสร้างจาก ChatGPT)..."
                                    className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs font-mono text-slate-200 focus:outline-none focus:border-purple-500"
                                />

                                <div className="flex justify-between items-center pt-2">
                                    <button 
                                        type="button"
                                        onClick={() => {
                                            const sample = JSON.stringify(DEFAULT_QUIZZES, null, 2);
                                            setImportJsonText(sample);
                                        }}
                                        className="text-xs text-purple-400 hover:underline">
                                        📄 ใส่ตัวอย่างโครงสร้าง JSON
                                    </button>
                                    <div className="flex gap-2">
                                        <button 
                                            onClick={() => setShowImportModal(false)}
                                            className="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-xl text-xs font-semibold">
                                            ยกเลิก
                                        </button>
                                        <button 
                                            onClick={() => processAndImportQuizzes(importJsonText)}
                                            className="bg-purple-600 hover:bg-purple-500 px-4 py-2 rounded-xl text-xs font-bold shadow-lg">
                                            ยืนยันนำเข้า
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Footer */}
                    <footer className="text-center text-xs text-slate-600 py-4 border-t border-slate-800">
                        Corporate Quiz App • สำหรับใช้จัดกิจกรรมภายในบริษัท
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
