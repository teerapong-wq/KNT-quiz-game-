<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Quiz App - Kahoot Style with Realtime Firebase</title>
    <!-- Tailwind CSS CDN สำหรับตกแต่ง UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone สำหรับแปลง JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Canvas Confetti สำหรับเอฟเฟกต์พลุฉลองผู้ชนะ -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Firebase Web SDK v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Kanit', sans-serif;
            user-select: none;
        }
        .animate-bounce-short {
            animation: bounce 0.5s ease-in-out 2;
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, Component } = React;

        // ==========================================
        // 📌 ค่ากำหนดระบบหลัก (ตั้งค่าครั้งเดียวใช้ได้ทุกเครื่อง)
        // ==========================================
        const DEFAULT_FB_URL = "https://knt-quiz-default-rtdb.asia-southeast1.firebasedatabase.app";
        // ⚠️ นำ Web API Key จาก Firebase Console -> Project Settings มาวางตรงนี้ (ไม่ใช่รหัสผ่าน เป็นคีย์สาธารณะสำหรับเชื่อมต่อ Auth)
        const DEFAULT_API_KEY = "";
        const DEFAULT_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw-5N50clAOoW-CPQAW90UlKgmq0_9VFMZEoTb6HQrmeTAtSWTXLBJIwhf96g6t5uxc/exec";

        // คลังชุดคำถามเริ่มต้นสำรอง (กรณีฐานข้อมูลยังว่าง)
        const DEFAULT_QUIZZES = [
            {
                id: 'default-1',
                title: 'ความรู้ทั่วไปองค์กร & ความปลอดภัย',
                description: 'ทดสอบความเข้าใจนโยบายบริษัทและการทำงานปลอดภัย',
                questions: [
                    {
                        id: 'q1',
                        questionText: 'วิสัยทัศน์และ Vision ของบริษัทเราเน้นเรื่องใดเป็นสำคัญที่สุด?',
                        images: [],
                        options: ['กำไรสูงสุด', 'นวัตกรรมและความยั่งยืน', 'ขยายสาขาต่างประเทศ', 'ลดต้นทุนผลิต'],
                        correctOption: 1,
                        timeLimit: 20,
                        points: 1000
                    },
                    {
                        id: 'q2',
                        questionText: 'เบอร์โทรศัพท์ฉุกเฉินสำหรับแจ้งเหตุภายในออฟฟิศคือเบอร์อะไร?',
                        images: [],
                        options: ['กด 0', 'กด 100', 'กด 999', 'กด 1193'],
                        correctOption: 2,
                        timeLimit: 15,
                        points: 1000
                    },
                    {
                        id: 'q3',
                        questionText: 'เมื่อเกิดสัญญาณเตือนภัยไหม้ สิ่งแรกที่ต้องทำคืออะไร?',
                        images: [],
                        options: ['เก็บของส่วนตัวใส่กระเป๋า', 'เดินลงทางบันไดหนีไฟทันที', 'กดลิฟต์ลงชั้น 1', 'นั่งรอฟังประกาศต่อ'],
                        correctOption: 1,
                        timeLimit: 15,
                        points: 1000
                    }
                ]
            }
        ];

        // ฟังก์ชันแปลง URL รูปภาพ (รองรับทั้งเว็บทั่วไป และ Google Drive Share Link)
        const formatImageUrl = (url) => {
            if (!url || typeof url !== 'string') return '';
            const trimmed = url.trim();
            const gDriveMatch = trimmed.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || trimmed.match(/id=([a-zA-Z0-9_-]+)/);
            if (gDriveMatch && (trimmed.includes('drive.google.com') || trimmed.includes('docs.google.com'))) {
                return `https://lh3.googleusercontent.com/d/${gDriveMatch[1]}`;
            }
            return trimmed;
        };

        // ฟังก์ชันตรวจสอบและจัดโครงสร้างข้อมูลคำถามให้ปลอดภัย ป้องกันข้อผิดพลาด undefined
        const sanitizeQuizzes = (raw) => {
            if (!raw) return DEFAULT_QUIZZES;
            let list = [];
            if (Array.isArray(raw)) {
                list = raw;
            } else if (typeof raw === 'object') {
                list = Object.values(raw);
            }
            if (!list || list.length === 0) return DEFAULT_QUIZZES;

            return list.map((q, qIdx) => {
                const rawQuestions = Array.isArray(q?.questions) 
                    ? q.questions 
                    : (q?.questions && typeof q.questions === 'object' ? Object.values(q.questions) : []);
                
                const cleanQuestions = rawQuestions.map((item, itemIdx) => {
                    let cleanImages = [];
                    if (Array.isArray(item?.images)) {
                        cleanImages = item.images.filter(x => typeof x === 'string' && x.trim() !== '').slice(0, 3);
                    } else if (item?.image && typeof item.image === 'string' && item.image.trim()) {
                        cleanImages = [item.image.trim()];
                    } else if (item?.imageUrl && typeof item.imageUrl === 'string' && item.imageUrl.trim()) {
                        cleanImages = [item.imageUrl.trim()];
                    }

                    return {
                        id: item?.id || `q-${Date.now()}-${itemIdx}`,
                        questionText: item?.questionText || item?.question || `คำถามข้อที่ ${itemIdx + 1}`,
                        images: cleanImages,
                        options: Array.isArray(item?.options) && item.options.length > 0 
                            ? item.options.map(o => String(o)) 
                            : (item?.options && typeof item.options === 'object' 
                                ? Object.values(item.options).map(o => String(o)) 
                                : ['ตัวเลือก 1', 'ตัวเลือก 2', 'ตัวเลือก 3', 'ตัวเลือก 4']),
                        correctOption: typeof item?.correctOption === 'number' ? item.correctOption : 0,
                        timeLimit: Number(item?.timeLimit) > 0 ? Number(item?.timeLimit) : 20,
                        points: Number(item?.points) || 1000
                    };
                });

                return {
                    id: q?.id || `quiz-${Date.now()}-${qIdx}`,
                    title: q?.title || `ชุดคำถามที่ ${qIdx + 1}`,
                    description: q?.description || '',
                    questions: cleanQuestions
                };
            });
        };

        // ระบบสร้างเสียงประกอบในเกมด้วย Web Audio API
        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'click') {
                    osc.frequency.setValueAtTime(400, ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.1);
                } else if (type === 'correct') {
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
                    osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, ctx.currentTime);
                    osc.frequency.setValueAtTime(150, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'count') {
                    osc.frequency.setValueAtTime(800, ctx.currentTime);
                    gain.gain.setValueAtTime(0.05, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.08);
                }
            } catch(e) {}
        };

        // ErrorBoundary ป้องกันหน้าเว็บค้างหรือจอดำหากข้อมูลแคชเสียหาย
        class ErrorBoundary extends Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            componentDidCatch(error, errorInfo) {
                console.error("ErrorBoundary error:", error, errorInfo);
            }
            handleReset() {
                try {
                    localStorage.removeItem('company_kahoot_quizzes');
                    localStorage.removeItem('kahoot_google_script_url');
                } catch(e) {}
                window.location.reload();
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen bg-slate-900 text-white flex items-center justify-center p-4">
                            <div className="bg-slate-800 border border-red-500/50 rounded-3xl p-8 max-w-md w-full text-center space-y-4 shadow-2xl">
                                <div className="text-5xl">⚠️</div>
                                <h2 className="text-xl font-bold text-red-400">ตรวจพบข้อผิดพลาดของข้อมูลแคช</h2>
                                <p className="text-slate-300 text-xs leading-relaxed">
                                    {this.state.error?.message || 'Data structure format issue detected.'}
                                </p>
                                <button 
                                    onClick={this.handleReset}
                                    className="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 rounded-xl text-sm transition shadow-lg">
                                    🔄 ล้างแคชและโหลดหน้าเว็บใหม่
                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        function App() {
            const [view, setView] = useState('HOME');

            // คลังชุดคำถามทั้งหมด (โหลดจาก LocalStorage และซิงค์ Firebase Cloud อัตโนมัติ)
            const [quizzes, setQuizzes] = useState(() => {
                try {
                    const saved = localStorage.getItem('company_kahoot_quizzes');
                    if (saved) return sanitizeQuizzes(JSON.parse(saved));
                } catch(e) {}
                return DEFAULT_QUIZZES;
            });

            // ป๊อปอัปแจ้งเตือน (แทนที่ alert/confirm มาตรฐาน)
            const [toastMessage, setToastMessage] = useState(null);
            const [confirmModal, setConfirmModal] = useState(null);
            const [showImportModal, setShowImportModal] = useState(false);
            const [importJsonText, setImportJsonText] = useState('');
            const [firebasePermissionError, setFirebasePermissionError] = useState(false);
            const [zoomImage, setZoomImage] = useState(null);

            const showToast = (msg, type = 'info') => {
                setToastMessage({ msg, type });
                setTimeout(() => setToastMessage(null), 3500);
            };

            const dbRef = useRef(null);
            const quizSectionRef = useRef(null);

            // สถานะสิทธิ์การเข้าถึงของ Admin (ผ่าน Firebase Authentication)
            const [isAdminAuth, setIsAdminAuth] = useState(false);
            const [adminUserEmail, setAdminUserEmail] = useState('');
            const [adminEmail, setAdminEmail] = useState('');
            const [adminPassword, setAdminPassword] = useState('');
            const [loginError, setLoginError] = useState('');
            const [isLoggingIn, setIsLoggingIn] = useState(false);

            // ลิงก์ Google Apps Script สำหรับสร้างไฟล์สรุปผลเป็น Google Sheet
            const [googleScriptUrl] = useState(() => {
                return localStorage.getItem('kahoot_google_script_url') || DEFAULT_SCRIPT_URL;
            });

            // 1. เชื่อมต่อ Firebase Realtime Database และระบบยืนยันตัวตนอัตโนมัติเมื่อเปิดเว็บ
            useEffect(() => {
                if (!window.firebase) return;
                try {
                    const cleanUrl = DEFAULT_FB_URL.trim().replace(/\/+$/, "");
                    let app;
                    const fbConfig = { databaseURL: cleanUrl };
                    if (DEFAULT_API_KEY && DEFAULT_API_KEY.trim()) {
                        fbConfig.apiKey = DEFAULT_API_KEY.trim();
                    }
                    if (!firebase.apps.length) {
                        app = firebase.initializeApp(fbConfig);
                    } else {
                        app = firebase.app();
                    }
                    dbRef.current = firebase.database(app);

                    // ติดตามสถานะการเข้าสู่ระบบของ Admin อัตโนมัติ (รีเฟรชหน้าเว็บก็ไม่หลุด)
                    let unsubscribeAuth = () => {};
                    if (DEFAULT_API_KEY && DEFAULT_API_KEY.trim()) {
                        unsubscribeAuth = firebase.auth().onAuthStateChanged((user) => {
                            if (user && user.email) {
                                setIsAdminAuth(true);
                                setAdminUserEmail(user.email);
                            } else {
                                setIsAdminAuth(false);
                                setAdminUserEmail('');
                            }
                        });
                    }

                    // ซิงค์คลังคำถามอัตโนมัติจาก Firebase
                    const quizzesRef = dbRef.current.ref('quizzes');
                    quizzesRef.on('value', (snapshot) => {
                        setFirebasePermissionError(false);
                        const data = snapshot.val();
                        if (data) {
                            const clean = sanitizeQuizzes(data);
                            setQuizzes(clean);
                            localStorage.setItem('company_kahoot_quizzes', JSON.stringify(clean));
                        }
                    }, (err) => {
                        if (err && err.code === 'PERMISSION_DENIED') {
                            setFirebasePermissionError(true);
                        }
                    });

                    return () => {
                        unsubscribeAuth();
                        quizzesRef.off('value');
                    };
                } catch (err) {
                    console.error("Firebase init error:", err);
                }
            }, []);

            // บันทึกคำถามขึ้น Firebase Cloud และ LocalStorage พร้อมกัน
            const syncQuizzesToCloud = (updatedList) => {
                const clean = sanitizeQuizzes(updatedList);
                setQuizzes(clean);
                localStorage.setItem('company_kahoot_quizzes', JSON.stringify(clean));
                if (dbRef.current) {
                    dbRef.current.ref('quizzes').set(clean)
                        .then(() => setFirebasePermissionError(false))
                        .catch(err => {
                            if (err && err.code === 'PERMISSION_DENIED') {
                                setFirebasePermissionError(true);
                            }
                        });
                }
            };

            // ตัวแปรสถานะห้องเกมและคำถาม
            const [activeQuiz, setActiveQuiz] = useState(null);
            const [quizMode, setQuizMode] = useState('POST_TEST'); // 'PRE_TEST' (ก่อนอบรม) | 'POST_TEST' (หลังอบรม)
            const [editingQuiz, setEditingQuiz] = useState(null);
            const [pinCode, setPinCode] = useState('');
            const [players, setPlayers] = useState([]);
            const [gameState, setGameState] = useState('LOBBY');
            const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
            const [currentQuestionData, setCurrentQuestionData] = useState(null);
            const [timeLeft, setTimeLeft] = useState(20);
            const [autoNextTime, setAutoNextTime] = useState(5);
            const [isSavingResults, setIsSavingResults] = useState(false);
            const [saveResultsMessage, setSaveResultsMessage] = useState('');

            // ตัวแปรสถานะฝั่งผู้เล่น (มือถือ)
            const [playerName, setPlayerName] = useState('');
            const [joinedPin, setJoinedPin] = useState('');
            const [myPlayerId, setMyPlayerId] = useState('');
            const [hasAnswered, setHasAnswered] = useState(false);
            const [selectedOption, setSelectedOption] = useState(null);

            // คอยรับรายชื่อผู้เล่นที่เข้ามาในห้อง Real-time
            useEffect(() => {
                const activePin = pinCode || joinedPin;
                if (activePin && dbRef.current) {
                    const playersRef = dbRef.current.ref('rooms/' + activePin + '/players');
                    const handlePlayers = (snapshot) => {
                        const data = snapshot.val();
                        if (data) {
                            const playerList = Object.keys(data).map(id => ({
                                id: id,
                                ...data[id]
                            }));
                            setPlayers(playerList);
                        } else {
                            setPlayers([]);
                        }
                    };
                    playersRef.on('value', handlePlayers);
                    return () => playersRef.off('value', handlePlayers);
                }
            }, [view, pinCode, joinedPin]);

            // คอยรับสถานะห้องเกมฝั่งมือถือผู้เล่น Real-time
            useEffect(() => {
                if (joinedPin && dbRef.current) {
                    const roomRef = dbRef.current.ref('rooms/' + joinedPin);
                    const handleRoomUpdate = (snapshot) => {
                        const data = snapshot.val();
                        if (data) {
                            if (data.gameState) setGameState(data.gameState);
                            if (data.currentQuestionIndex !== undefined) {
                                setCurrentQuestionIndex(data.currentQuestionIndex);
                            }
                            if (data.timeLeft !== undefined) setTimeLeft(data.timeLeft);
                            if (data.autoNextTime !== undefined) setAutoNextTime(data.autoNextTime);
                            if (data.currentQuestion) {
                                setCurrentQuestionData(data.currentQuestion);
                            }
                        }
                    };
                    roomRef.on('value', handleRoomUpdate);
                    return () => roomRef.off('value', handleRoomUpdate);
                }
            }, [view, joinedPin]);

            // รีเซ็ตการกดตอบเมื่อเปลี่ยนข้อใหม่
            useEffect(() => {
                if (gameState === 'QUESTION') {
                    setHasAnswered(false);
                    setSelectedOption(null);
                }
            }, [currentQuestionIndex, gameState]);

            // ส่งสถานะห้องเกมขึ้น Firebase เพื่อให้มือถือเปลี่ยนตาม
            const syncRoomStateToFirebase = (newState, questionIdx, timerSecs, autoNextSecs = 5, customQuestion = null) => {
                if (!pinCode || !dbRef.current) return;
                const currentQ = customQuestion || activeQuiz?.questions?.[questionIdx];
                const payload = {
                    gameState: newState,
                    currentQuestionIndex: questionIdx,
                    timeLeft: timerSecs,
                    autoNextTime: autoNextSecs,
                    quizMode: quizMode
                };
                if (currentQ) {
                    payload.currentQuestion = {
                        questionText: currentQ.questionText,
                        images: currentQ.images || [],
                        options: currentQ.options || [],
                        timeLimit: currentQ.timeLimit || 20
                    };
                }
                dbRef.current.ref('rooms/' + pinCode).update(payload);
            };

            // ล็อกอิน Admin ผ่าน Firebase Authentication (Email & Password)
            const handleAdminLogin = async (e) => {
                e.preventDefault();
                if (!DEFAULT_API_KEY || !DEFAULT_API_KEY.trim()) {
                    setLoginError('ยังไม่ได้ใส่ค่า DEFAULT_API_KEY ในไฟล์ index.html (กรุณานำ Web API Key จาก Firebase มาใส่ก่อน)');
                    playSound('wrong');
                    return;
                }
                if (!adminEmail.trim() || !adminPassword) {
                    setLoginError('กรุณากรอกอีเมลและรหัสผ่านให้ครบถ้วน');
                    playSound('wrong');
                    return;
                }

                setIsLoggingIn(true);
                setLoginError('');
                try {
                    const userCredential = await firebase.auth().signInWithEmailAndPassword(adminEmail.trim(), adminPassword);
                    const loggedInEmail = userCredential.user?.email || adminEmail.trim();
                    setIsAdminAuth(true);
                    setAdminUserEmail(loggedInEmail);
                    setAdminPassword('');
                    setView('HOME');
                    playSound('correct');
                    showToast(`✅ เข้าสู่ระบบสำเร็จ (${loggedInEmail})`, 'success');
                } catch (err) {
                    console.error("Firebase Auth Error:", err);
                    let msg = 'เข้าสู่ระบบไม่สำเร็จ กรุณาตรวจสอบอีเมลและรหัสผ่าน';
                    if (err.code === 'auth/invalid-email') {
                        msg = 'รูปแบบอีเมลไม่ถูกต้อง';
                    } else if (
                        err.code === 'auth/user-not-found' ||
                        err.code === 'auth/wrong-password' ||
                        err.code === 'auth/invalid-credential'
                    ) {
                        msg = 'อีเมลหรือรหัสผ่านไม่ถูกต้อง';
                    } else if (err.code === 'auth/too-many-requests') {
                        msg = 'พยายามเข้าสู่ระบบผิดหลายครั้งเกินไป กรุณารอสักครู่แล้วลองใหม่';
                    } else if (err.code === 'auth/api-key-not-valid.-please-pass-a-valid-api-key.') {
                        msg = 'ค่า Web API Key ไม่ถูกต้อง กรุณาตรวจสอบตัวแปร DEFAULT_API_KEY';
                    }
                    setLoginError(msg);
                    playSound('wrong');
                } finally {
                    setIsLoggingIn(false);
                }
            };

            // ออกจากระบบ Admin
            const handleLogoutAdmin = async () => {
                try {
                    if (window.firebase && firebase.apps.length && DEFAULT_API_KEY && DEFAULT_API_KEY.trim()) {
                        await firebase.auth().signOut();
                    }
                } catch (err) {
                    console.error("Sign out error:", err);
                }
                setIsAdminAuth(false);
                setAdminUserEmail('');
                setAdminPassword('');
                setView('HOME');
                showToast('ออกจากระบบ Admin แล้ว', 'info');
            };

            // จัดการชุดคำถาม (สร้าง / ลบ / สำรอง / นำเข้า)
            const handleCreateNewQuiz = () => {
                const newQ = {
                    id: 'quiz-' + Date.now(),
                    title: 'ชุดคำถามใหม่ (ยังไม่ได้ตั้งชื่อ)',
                    description: 'คำอธิบายชุดคำถาม...',
                    questions: []
                };
                const updatedList = [...quizzes, newQ];
                syncQuizzesToCloud(updatedList);
                setEditingQuiz(newQ);
                setView('ADMIN_QUIZ_EDIT');
                showToast('สร้างชุดคำถามใหม่แล้ว', 'success');
            };

            const handleDeleteQuiz = (id) => {
                setConfirmModal({
                    message: 'คุณแน่ใจหรือไม่ว่าต้องการลบชุดคำถามนี้?',
                    onConfirm: () => {
                        const updated = quizzes.filter(q => q.id !== id);
                        syncQuizzesToCloud(updated);
                        showToast('ลบชุดคำถามเรียบร้อยแล้ว', 'info');
                        setConfirmModal(null);
                    }
                });
            };

            const handleExportBackup = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(quizzes, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", `kahoot_quizzes_backup_${Date.now()}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            };

            const processAndImportQuizzes = (rawInput) => {
                const text = (rawInput || importJsonText || '').trim();
                if (!text) {
                    showToast('⚠️ กรุณาระบุหรือเลือกไฟล์ JSON ก่อน', 'error');
                    return;
                }
                try {
                    let cleanText = text;
                    cleanText = cleanText.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '').trim();
                    cleanText = cleanText.replace(/[\u201C\u201D]/g, '"').replace(/[\u2018\u2019]/g, "'");

                    let parsed;
                    try {
                        parsed = JSON.parse(cleanText);
                    } catch (parseErr) {
                        const relaxedText = cleanText.replace(/,\s*([\]}])/g, '$1');
                        parsed = JSON.parse(relaxedText);
                    }

                    let extracted = null;
                    if (Array.isArray(parsed)) {
                        if (parsed.length > 0 && (parsed[0].questionText || parsed[0].options)) {
                            extracted = [{
                                id: 'quiz-' + Date.now(),
                                title: 'ชุดคำถามนำเข้า (' + new Date().toLocaleDateString('th-TH') + ')',
                                description: 'นำเข้าจากรายการข้อคำถาม',
                                questions: parsed
                            }];
                        } else {
                            extracted = parsed;
                        }
                    } else if (parsed && typeof parsed === 'object') {
                        if (Array.isArray(parsed.quizzes)) {
                            extracted = parsed.quizzes;
                        } else if (Array.isArray(parsed.quizzes_data)) {
                            extracted = parsed.quizzes_data;
                        } else if (Array.isArray(parsed.data)) {
                            extracted = parsed.data;
                        } else if (parsed.questions && Array.isArray(parsed.questions)) {
                            extracted = [parsed];
                        }
                    }

                    const normalized = sanitizeQuizzes(extracted);
                    syncQuizzesToCloud(normalized);
                    setShowImportModal(false);
                    setImportJsonText('');
                    const totalQuestions = normalized.reduce((acc, q) => acc + (q.questions || []).length, 0);
                    showToast(`✅ นำเข้าสำเร็จ ${normalized.length} ชุดคำถาม (${totalQuestions} ข้อ) แล้ว!`, 'success');
                    playSound('correct');
                } catch (err) {
                    console.error("JSON Parse Error:", err);
                    showToast(`⚠️ เกิดข้อผิดพลาดในการอ่าน JSON: ${err.message}`, 'error');
                    playSound('wrong');
                }
            };

            // จัดการข้อคำถาม (เพิ่ม / ลบ / แก้ไขรูปภาพสูงสุด 3 รูป / เวลามาตรฐาน)
            const handleAddQuestion = () => {
                if (!editingQuiz) return;
                const newQuestion = {
                    id: 'q-' + Date.now(),
                    questionText: 'คำถามข้อใหม่...',
                    images: [],
                    options: ['ตัวเลือก A', 'ตัวเลือก B', 'ตัวเลือก C', 'ตัวเลือก D'],
                    correctOption: 0,
                    timeLimit: 20,
                    points: 1000
                };
                const updated = {
                    ...editingQuiz,
                    questions: [...(editingQuiz.questions || []), newQuestion]
                };
                setEditingQuiz(updated);
                const updatedAll = quizzes.map(q => q.id === updated.id ? updated : q);
                syncQuizzesToCloud(updatedAll);
            };

            const handleAddQuestionImage = (qIndex) => {
                if (!editingQuiz) return;
                const updatedQuestions = [...(editingQuiz.questions || [])];
                const currentImages = updatedQuestions[qIndex]?.images || [];
                if (currentImages.length >= 3) {
                    showToast('⚠️ ใส่รูปภาพได้สูงสุด 3 รูปต่อข้อ', 'error');
                    return;
                }
                updatedQuestions[qIndex] = {
                    ...updatedQuestions[qIndex],
                    images: [...currentImages, '']
                };
                const updatedQuiz = { ...editingQuiz, questions: updatedQuestions };
                setEditingQuiz(updatedQuiz);
                const updatedAll = quizzes.map(q => q.id === updatedQuiz.id ? updatedQuiz : q);
                syncQuizzesToCloud(updatedAll);
            };

            const handleUpdateQuestionImage = (qIndex, imgIdx, value) => {
                if (!editingQuiz) return;
                const updatedQuestions = [...(editingQuiz.questions || [])];
                const newImages = [...(updatedQuestions[qIndex]?.images || [])];
                newImages[imgIdx] = value;
                updatedQuestions[qIndex] = {
                    ...updatedQuestions[qIndex],
                    images: newImages
                };
                const updatedQuiz = { ...editingQuiz, questions: updatedQuestions };
                setEditingQuiz(updatedQuiz);
                const updatedAll = quizzes.map(q => q.id === updatedQuiz.id ? updatedQuiz : q);
                syncQuizzesToCloud(updatedAll);
            };

            const handleDeleteQuestionImage = (qIndex, imgIdx) => {
                if (!editingQuiz) return;
                const updatedQuestions = [...(editingQuiz.questions || [])];
                const newImages = (updatedQuestions[qIndex]?.images || []).filter((_, idx) => idx !== imgIdx);
                updatedQuestions[qIndex] = {
                    ...updatedQuestions[qIndex],
                    images: newImages
                };
                const updatedQuiz = { ...editingQuiz, questions: updatedQuestions };
                setEditingQuiz(updatedQuiz);
                const updatedAll = quizzes.map(q => q.id === updatedQuiz.id ? updatedQuiz : q);
                syncQuizzesToCloud(updatedAll);
            };

            const handleUpdateQuestion = (qIndex, field, value) => {
                if (!editingQuiz) return;
                const updatedQuestions = [...(editingQuiz.questions || [])];
                updatedQuestions[qIndex] = {
                    ...updatedQuestions[qIndex],
                    [field]: value
                };
                const updatedQuiz = { ...editingQuiz, questions: updatedQuestions };
                setEditingQuiz(updatedQuiz);
                const updatedAll = quizzes.map(q => q.id === updatedQuiz.id ? updatedQuiz : q);
                syncQuizzesToCloud(updatedAll);
            };

            const handleUpdateOption = (qIndex, optIndex, value) => {
                if (!editingQuiz) return;
                const updatedQuestions = [...(editingQuiz.questions || [])];
                const newOptions = [...(updatedQuestions[qIndex]?.options || [])];
                newOptions[optIndex] = value;
                updatedQuestions[qIndex].options = newOptions;

                const updatedQuiz = { ...editingQuiz, questions: updatedQuestions };
                setEditingQuiz(updatedQuiz);
                const updatedAll = quizzes.map(q => q.id === updatedQuiz.id ? updatedQuiz : q);
                syncQuizzesToCloud(updatedAll);
            };

            const handleDeleteQuestion = (qIndex) => {
                if (!editingQuiz) return;
                setConfirmModal({
                    message: 'ยืนยันลบข้อคำถามนี้?',
                    onConfirm: () => {
                        const updatedQuestions = (editingQuiz.questions || []).filter((_, idx) => idx !== qIndex);
                        const updatedQuiz = { ...editingQuiz, questions: updatedQuestions };
                        setEditingQuiz(updatedQuiz);
                        const updatedAll = quizzes.map(q => q.id === updatedQuiz.id ? updatedQuiz : q);
                        syncQuizzesToCloud(updatedAll);
                        setConfirmModal(null);
                        showToast('ลบข้อคำถามเรียบร้อยแล้ว', 'info');
                    }
                });
            };

            // เริ่มห้องเล่นเกมฝั่งวิทยากร (Host) - สงวนสิทธิ์เฉพาะ Admin ที่ล็อกอินแล้วเท่านั้น
            const startHostLobby = (quiz, mode = 'POST_TEST') => {
                if (!isAdminAuth) {
                    showToast('🔒 กรุณาเข้าสู่ระบบ Admin ก่อนสร้างห้องเล่นเกม', 'error');
                    setView('ADMIN_LOGIN');
                    return;
                }
                const cleanQ = sanitizeQuizzes([quiz])[0];
                const randomPin = Math.floor(100000 + Math.random() * 900000).toString();
                setActiveQuiz(cleanQ);
                setQuizMode(mode);
                setPinCode(randomPin);
                setPlayers([]);
                setGameState('LOBBY');
                setView('HOST_LOBBY');

                if (dbRef.current) {
                    dbRef.current.ref('rooms/' + randomPin).set({
                        gameState: 'LOBBY',
                        currentQuestionIndex: 0,
                        timeLeft: cleanQ.questions[0]?.timeLimit || 20,
                        quizTitle: cleanQ.title,
                        quizMode: mode
                    });
                }
            };

            const startFirstQuestion = () => {
                if (!activeQuiz || !activeQuiz.questions || activeQuiz.questions.length === 0) {
                    showToast('⚠️ ชุดคำถามนี้ยังไม่มีข้อคำถาม กรุณาเพิ่มคำถามก่อนเริ่มเล่น', 'error');
                    return;
                }
                setCurrentQuestionIndex(0);
                setGameState('QUESTION');
                setView('HOST_GAME');
                const t = activeQuiz.questions[0]?.timeLimit || 20;
                setTimeLeft(t);
                syncRoomStateToFirebase('QUESTION', 0, t, 5);
            };

            // ลูปนับถอยหลังวินาทีต่อวินาที
            useEffect(() => {
                let timerInterval = null;
                let autoNextInterval = null;

                if (view === 'HOST_GAME' && gameState === 'QUESTION') {
                    timerInterval = setInterval(() => {
                        setTimeLeft(prev => {
                            if (prev <= 1) {
                                clearInterval(timerInterval);
                                evaluateCurrentQuestion();
                                return 0;
                            }
                            const nextT = prev - 1;
                            playSound('count');
                            syncRoomStateToFirebase('QUESTION', currentQuestionIndex, nextT, 5);
                            return nextT;
                        });
                    }, 1000);
                } else if (view === 'HOST_GAME' && gameState === 'RESULT') {
                    setAutoNextTime(5);
                    autoNextInterval = setInterval(() => {
                        setAutoNextTime(prev => {
                            if (prev <= 1) {
                                clearInterval(autoNextInterval);
                                goToNextQuestion();
                                return 0;
                            }
                            const nextAuto = prev - 1;
                            syncRoomStateToFirebase('RESULT', currentQuestionIndex, 0, nextAuto);
                            return nextAuto;
                        });
                    }, 1000);
                }

                return () => {
                    if (timerInterval) clearInterval(timerInterval);
                    if (autoNextInterval) clearInterval(autoNextInterval);
                };
            }, [view, gameState, currentQuestionIndex]);

            // คำนวณคะแนนเมื่อหมดเวลาในแต่ละข้อ (ดึงข้อมูลคำตอบล่าสุดจาก Firebase)
            const evaluateCurrentQuestion = () => {
                setGameState('RESULT');
                setAutoNextTime(5);
                
                if (!pinCode || !dbRef.current || !activeQuiz) return;
                const currentQ = activeQuiz.questions?.[currentQuestionIndex];
                if (!currentQ) return;

                dbRef.current.ref('rooms/' + pinCode + '/players').once('value', (snapshot) => {
                    const data = snapshot.val();
                    if (!data) return;

                    Object.keys(data).forEach(id => {
                        const p = data[id];
                        let earned = 0;
                        
                        if (p.lastAnswer !== null && p.lastAnswer !== undefined && Number(p.lastAnswer) === Number(currentQ.correctOption)) {
                            const remTime = p.answerTime !== undefined && p.answerTime !== null ? Number(p.answerTime) : 1;
                            const totalLimit = Number(currentQ.timeLimit) || 20;
                            const timeRatio = Math.min(1, Math.max(0.1, remTime / totalLimit));
                            earned = Math.round((Number(currentQ.points) || 1000) * timeRatio);
                        }
                        
                        const newScore = (Number(p.score) || 0) + earned;

                        dbRef.current.ref('rooms/' + pinCode + '/players/' + id).update({
                            score: newScore,
                            lastEarned: earned
                        });
                    });
                });

                syncRoomStateToFirebase('RESULT', currentQuestionIndex, 0, 5);
            };

            const goToNextQuestion = () => {
                if (currentQuestionIndex + 1 < (activeQuiz?.questions?.length || 0)) {
                    const nextIdx = currentQuestionIndex + 1;
                    setCurrentQuestionIndex(nextIdx);
                    
                    if (dbRef.current && pinCode) {
                        dbRef.current.ref('rooms/' + pinCode + '/players').once('value', (snapshot) => {
                            const data = snapshot.val();
                            if (data) {
                                Object.keys(data).forEach(id => {
                                    dbRef.current.ref('rooms/' + pinCode + '/players/' + id).update({
                                        lastAnswer: null,
                                        answerTime: 0
                                    });
                                });
                            }
                        });
                    }

                    setGameState('QUESTION');
                    const t = activeQuiz.questions[nextIdx]?.timeLimit || 20;
                    setTimeLeft(t);
                    syncRoomStateToFirebase('QUESTION', nextIdx, t, 5);
                } else {
                    setGameState('FINISHED');
                    syncRoomStateToFirebase('FINISHED', currentQuestionIndex, 0, 0);
                    confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
                    setTimeout(() => {
                        handleSaveResultsToGoogleDrive();
                    }, 500);
                }
            };

            // บันทึกผลคะแนนสรุปลง Google Sheet อัตโนมัติผ่าน Google Apps Script
            const handleSaveResultsToGoogleDrive = async () => {
                if (!googleScriptUrl || !activeQuiz) return;
                setIsSavingResults(true);
                setSaveResultsMessage('⏳ กำลังสร้างไฟล์สรุปผลคะแนนลง Google Sheet...');

                try {
                    let latestPlayers = players;
                    if (dbRef.current && pinCode) {
                        const snap = await dbRef.current.ref('rooms/' + pinCode + '/players').once('value');
                        const val = snap.val();
                        if (val) {
                            latestPlayers = Object.keys(val).map(id => ({ id, ...val[id] }));
                        }
                    }

                    const payload = {
                        action: 'SAVE_RESULTS',
                        quizTitle: `${activeQuiz.title} (${quizMode === 'PRE_TEST' ? 'ก่อนอบรม' : 'หลังอบรม'})`,
                        questions: activeQuiz.questions || [],
                        players: latestPlayers.map(p => ({
                            name: p.name,
                            score: p.score || 0,
                            playerAnswers: p.answersHistory || {}
                        }))
                    };

                    await fetch(googleScriptUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });

                    setSaveResultsMessage('✅ ส่งข้อมูลสร้างไฟล์สรุปคะแนนลง Google Sheet ใน Google Drive เรียบร้อยแล้ว!');
                    showToast('📊 บันทึกผลคะแนนลง Google Sheet สำเร็จ!', 'success');
                } catch (err) {
                    console.error('Save to Google Sheet error:', err);
                    setSaveResultsMessage('⚠️ ไม่สามารถเชื่อมต่อ Google Sheet ได้: ' + err.message);
                } finally {
                    setIsSavingResults(false);
                }
            };

            // เข้าร่วมเล่นฝั่งพนักงาน (Player)
            const handlePlayerJoin = (e) => {
                e.preventDefault();
                if (!playerName.trim() || !joinedPin.trim()) {
                    return showToast('กรุณากรอก PIN และชื่อของคุณ', 'error');
                }
                
                const myId = 'p-' + Date.now();
                setMyPlayerId(myId);

                if (!dbRef.current && window.firebase) {
                    try {
                        const cleanUrl = DEFAULT_FB_URL.trim().replace(/\/+$/, "");
                        let app = !firebase.apps.length ? firebase.initializeApp({ databaseURL: cleanUrl }) : firebase.app();
                        dbRef.current = firebase.database(app);
                    } catch (err) {
                        console.error(err);
                    }
                }

                if (!dbRef.current) {
                    return showToast('❌ ไม่สามารถเชื่อมต่อระบบ Realtime Database ได้', 'error');
                }

                dbRef.current.ref('rooms/' + joinedPin).once('value')
                    .then((snapshot) => {
                        if (snapshot.exists()) {
                            dbRef.current.ref('rooms/' + joinedPin + '/players/' + myId).set({
                                name: playerName,
                                score: 0,
                                lastAnswer: null,
                                answerTime: 0,
                                answersHistory: {}
                            }).then(() => {
                                setView('PLAYER_GAME');
                                playSound('correct');
                            });
                        } else {
                            showToast('❌ ไม่พบห้องรหัส PIN นี้ (' + joinedPin + ')', 'error');
                        }
                    })
                    .catch((err) => {
                        showToast('❌ ไม่สามารถเชื่อมต่อฐานข้อมูลได้: ' + err.message, 'error');
                    });
            };

            const handleAnswerSubmit = (optionIndex) => {
                if (hasAnswered || gameState !== 'QUESTION' || !myPlayerId || !joinedPin) return;
                setHasAnswered(true);
                setSelectedOption(optionIndex);
                playSound('click');

                if (dbRef.current) {
                    dbRef.current.ref('rooms/' + joinedPin + '/players/' + myPlayerId).once('value', (snapshot) => {
                        const playerVal = snapshot.val() || {};
                        const updatedHistory = { ...(playerVal.answersHistory || {}), [currentQuestionIndex]: optionIndex };
                        dbRef.current.ref('rooms/' + joinedPin + '/players/' + myPlayerId).update({
                            lastAnswer: optionIndex,
                            answerTime: timeLeft,
                            answersHistory: updatedHistory
                        });
                    });
                }
            };

            // สไตล์กรอบคำตอบ: พื้นหลังสีขาว ตัวอักษรสีดำ ขอบสีตามตัวเลือก
            const choiceStyles = [
                { border: 'border-red-500', badgeBg: 'bg-red-600', hoverBg: 'hover:bg-red-50' },
                { border: 'border-blue-500', badgeBg: 'bg-blue-600', hoverBg: 'hover:bg-blue-50' },
                { border: 'border-amber-500', badgeBg: 'bg-amber-500', hoverBg: 'hover:bg-amber-50' },
                { border: 'border-emerald-500', badgeBg: 'bg-emerald-600', hoverBg: 'hover:bg-emerald-50' }
            ];
            const optionIcons = ['▲', '◆', '●', '■'];

            return (
                <div className="min-h-screen flex flex-col justify-between p-4 max-w-6xl mx-auto relative">
                    
                    {/* กล่องแจ้งเตือน Toast */}
                    {toastMessage && (
                        <div className={`fixed top-4 right-4 z-50 px-4 py-3 rounded-xl shadow-2xl text-sm font-bold border transition-all ${
                            toastMessage.type === 'error' ? 'bg-red-900 border-red-500 text-red-200' :
                            toastMessage.type === 'success' ? 'bg-green-900 border-green-500 text-green-200' :
                            'bg-slate-800 border-purple-500 text-purple-200'
                        }`}>
                            {toastMessage.msg}
                        </div>
                    )}

                    {/* ป๊อปอัปยืนยันการลบ */}
                    {confirmModal && (
                        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-slate-800 border border-slate-700 rounded-2xl max-w-sm w-full p-6 text-center space-y-4">
                                <div className="text-3xl">⚠️</div>
                                <h3 className="text-base font-bold text-slate-200">{confirmModal.message}</h3>
                                <div className="flex gap-2 pt-2">
                                    <button 
                                        onClick={() => setConfirmModal(null)}
                                        className="w-1/2 bg-slate-700 hover:bg-slate-600 py-2 rounded-xl text-xs font-semibold">
                                        ยกเลิก
                                    </button>
                                    <button 
                                        onClick={confirmModal.onConfirm}
                                        className="w-1/2 bg-red-600 hover:bg-red-500 py-2 rounded-xl text-xs font-bold">
                                        ยืนยัน
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* กล่องขยายภาพใหญ่ (Lightbox) */}
                    {zoomImage && (
                        <div 
                            className="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex flex-col items-center justify-center p-4"
                            onClick={() => setZoomImage(null)}>
                            <div className="relative max-w-4xl max-h-[90vh] bg-slate-900 border border-slate-700 p-2 rounded-2xl shadow-2xl" onClick={e => e.stopPropagation()}>
                                <button 
                                    onClick={() => setZoomImage(null)}
                                    className="absolute -top-3 -right-3 bg-red-600 hover:bg-red-500 text-white rounded-full w-8 h-8 flex items-center justify-center font-bold text-sm shadow-lg">
                                    ✕
                                </button>
                                <img 
                                    src={zoomImage} 
                                    alt="ภาพขยาย" 
                                    className="max-w-full max-h-[80vh] object-contain rounded-xl"
                                    onError={(e) => {
                                        e.target.onerror = null;
                                        e.target.src = 'https://placehold.co/600x400/1e293b/94a3b8?text=Image+Load+Error';
                                    }}
                                />
                                <p className="text-center text-xs text-slate-400 mt-2">คลิกด้านนอกหรือปุ่ม ✕ เพื่อปิด</p>
                            </div>
                        </div>
                    )}

                    {/* แถบหัวเว็บ Header Bar */}
                    <header className="flex justify-between items-center py-3 border-b border-slate-800">
                        <div className="flex items-center gap-2 cursor-pointer" onClick={() => setView('HOME')}>
                            <div className="bg-purple-600 p-2 rounded-lg font-black text-xl tracking-wider">QCK</div>
                            <span className="font-bold text-xl bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">
                                Corporate Quiz App
                            </span>
                        </div>

                        <div className="flex gap-2">
                            {isAdminAuth ? (
                                <div className="flex items-center gap-2">
                                    <span className="text-xs bg-green-500/20 text-green-400 px-3 py-1 rounded-full border border-green-500/30 flex items-center gap-1" title={adminUserEmail}>
                                        🔓 {adminUserEmail || 'Admin Login อยู่'}
                                    </span>
                                    <button 
                                        onClick={() => setView('ADMIN_QUIZ_LIST')}
                                        className="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700">
                                        จัดการชุดคำถาม
                                    </button>
                                    <button 
                                        onClick={handleLogoutAdmin}
                                        className="text-xs bg-red-600/80 hover:bg-red-600 px-3 py-1.5 rounded-lg">
                                        ออกจากระบบ
                                    </button>
                                </div>
                            ) : (
                                <button 
                                    onClick={() => setView('ADMIN_LOGIN')}
                                    className="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 text-slate-300 flex items-center gap-1">

                                                        className={`bg-white text-slate-900 border-4 ${choiceStyles[idx]?.border || 'border-slate-300'} ${
                                                            isSelected 
                                                                ? 'ring-4 ring-purple-600 bg-purple-50 scale-[1.02] shadow-2xl' 
                                                                : hasAnswered 
                                                                    ? 'opacity-40 cursor-not-allowed' 
                                                                    : choiceStyles[idx]?.hoverBg + ' active:scale-95'
                                                        } p-4 rounded-2xl font-bold text-base flex items-center gap-3 transition transform shadow-md text-left`}>
                                                        <span className={`w-9 h-9 rounded-xl ${choiceStyles[idx]?.badgeBg || 'bg-slate-700'} text-white flex items-center justify-center font-black text-lg shrink-0 shadow`}>
                                                            {optionIcons[idx]}
                                                        </span>
                                                        <span className="flex-1 text-slate-900 font-bold leading-snug">{opt}</span>
                                                        {isSelected && (
                                                            <span className="text-xs bg-purple-600 text-white font-bold px-2.5 py-1 rounded-full shrink-0 shadow">
                                                                ✓ ตัวเลือกของคุณ
                                                            </span>
                                                        )}
                                                    </button>
                                                );
                                            })}
                                        </div>

                                        {hasAnswered && (
                                            <div className="bg-purple-950/80 border border-purple-500/50 text-purple-200 text-xs p-3 rounded-xl text-center font-bold animate-pulse">
                                                🔒 ล็อกคำตอบเรียบร้อยแล้ว! กรุณารอตารางคะแนนบนหน้าจอใหญ่...
                                            </div>
                                        )}
                                    </div>
                                )}

                                {gameState === 'RESULT' && (
                                    <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 text-center space-y-4 shadow-xl">
                                        <h3 className="text-lg font-bold text-yellow-400">📊 ตารางสรุปคะแนนข้อนี้</h3>
                                        <div className="text-xs text-slate-400">เริ่มข้อถัดไปใน {autoNextTime} วินาที...</div>

                                        <div className="space-y-2 max-h-60 overflow-y-auto pt-2">
                                            {players.sort((a,b) => (b.score || 0) - (a.score || 0)).map((p, idx) => (
                                                <div key={p.id} className={`flex justify-between items-center p-3 rounded-xl text-xs font-bold ${
                                                    p.id === myPlayerId ? 'bg-purple-900/60 border border-purple-500/50 text-white' : 'bg-slate-900 text-slate-300'
                                                }`}>
                                                    <span>#{idx+1} {p.name} {p.id === myPlayerId ? '(คุณ)' : ''}</span>
                                                    <span className="text-yellow-400">{p.score || 0} คะแนน</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {gameState === 'FINISHED' && (
                                    <div className="bg-slate-800 p-8 rounded-3xl border border-yellow-500/40 text-center space-y-4 shadow-xl">
                                        <div className="text-5xl">🏆</div>
                                        <h3 className="text-2xl font-black text-yellow-400">จบการแข่งขัน!</h3>
                                        <p className="text-sm text-slate-300">ขอบคุณสำหรับการเข้าร่วมกิจกรรมในครั้งนี้</p>
                                    </div>
                                )}
                            </div>
                        )}

                    </main>

                    {/* กล่องนำเข้าไฟล์ Import JSON */}
                    {showImportModal && isAdminAuth && (
                        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-slate-800 border border-slate-700 rounded-2xl max-w-lg w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center border-b border-slate-700 pb-3">
                                    <h3 className="text-lg font-bold text-purple-300">📤 นำเข้าคลังคำถาม (Import JSON)</h3>
                                    <button 
                                        onClick={() => setShowImportModal(false)}
                                        className="text-slate-400 hover:text-white text-lg px-2">
                                        ✕
                                    </button>
                                </div>

                                <div className="bg-slate-900/80 border-2 border-dashed border-purple-500/40 hover:border-purple-400 rounded-xl p-4 text-center transition">
                                    <label className="cursor-pointer block">
                                        <div className="text-3xl mb-1">📁</div>
                                        <span className="text-xs font-bold text-purple-300 block">คลิกเพื่อเลือกไฟล์ .json จากเครื่อง</span>
                                        <span className="text-[11px] text-slate-400">เลือกไฟล์สำรองข้อมูลเพื่อนำเข้าทันที (ไม่ต้องก๊อปปี้ข้อความ)</span>
                                        <input 
                                            type="file" 
                                            accept=".json,application/json,text/plain" 
                                            className="hidden" 
                                            onChange={(e) => {
                                                const file = e.target.files && e.target.files[0];
                                                if (file) {
                                                    const reader = new FileReader();
                                                    reader.onload = (event) => {
                                                        const content = event.target.result;
                                                        setImportJsonText(content);
                                                        processAndImportQuizzes(content);
                                                    };
                                                    reader.readAsText(file);
                                                }
                                            }}
                                        />
                                    </label>
                                </div>

                                <div className="text-center text-xs text-slate-500 font-semibold">— หรือ วางโค้ด JSON ลงในช่องด้านล่าง —</div>

                                <textarea 
                                    value={importJsonText}
                                    onChange={(e) => setImportJsonText(e.target.value)}
                                    rows={6}
                                    placeholder="วางโค้ด JSON ที่นี่..."
                                    className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs font-mono text-slate-200 focus:outline-none focus:border-purple-500"
                                />

                                <div className="flex justify-between items-center pt-2">
                                    <button 
                                        type="button"
                                        onClick={() => {
                                            const sample = JSON.stringify(DEFAULT_QUIZZES, null, 2);
                                            setImportJsonText(sample);
                                        }}
                                        className="text-xs text-purple-400 hover:underline">
                                        📄 ใส่ตัวอย่างโครงสร้าง JSON
                                    </button>
                                    <div className="flex gap-2">
                                        <button 
                                            onClick={() => setShowImportModal(false)}
                                            className="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-xl text-xs font-semibold">
                                            ยกเลิก
                                        </button>
                                        <button 
                                            onClick={() => processAndImportQuizzes(importJsonText)}
                                            className="bg-purple-600 hover:bg-purple-500 px-4 py-2 rounded-xl text-xs font-bold shadow-lg">
                                            ยืนยันนำเข้า
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* แถบท้าย Footer */}
                    <footer className="text-center text-xs text-slate-600 py-4 border-t border-slate-800">
                        Corporate Quiz App • สำหรับใช้จัดกิจกรรมภายในบริษัท
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
