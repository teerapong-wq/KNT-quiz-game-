<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Quiz App - Kahoot Style with Realtime Firebase</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Firebase Web SDK v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Kanit', sans-serif;
            user-select: none;
        }
        .animate-bounce-short {
            animation: bounce 0.5s ease-in-out 2;
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // รหัสผ่านสำหรับเข้าสู่ระบบ Admin
        const ADMIN_PASSCODE = "QCKNT10520";

        // คลังชุดคำถามเริ่มต้นกรณีไม่มีใน LocalStorage
        const DEFAULT_QUIZZES = [
            {
                id: 'default-1',
                title: 'ความรู้ทั่วไปองค์กร & ความปลอดภัย',
                description: 'ทดสอบความเข้าใจนโยบายบริษัทและการทำงานปลอดภัย',
                questions: [
                    {
                        id: 'q1',
                        questionText: 'วิจักษ์และ Vision ของบริษัทเราเน้นเรื่องใดเป็นสำคัญที่สุด?',
                        options: ['กำไรสูงสุด', 'นวัตกรรมและความยั่งยืน', 'ขยายสาขาต่างประเทศ', 'ลดต้นทุนผลิต'],
                        correctOption: 1,
                        timeLimit: 20,
                        points: 1000
                    },
                    {
                        id: 'q2',
                        questionText: 'เบอร์โทรศัพท์ฉุกเฉินสำหรับแจ้งเหตุภายในออฟฟิศคือเบอร์อะไร?',
                        options: ['กด 0', 'กด 100', 'กด 999', 'กด 1193'],
                        correctOption: 2,
                        timeLimit: 15,
                        points: 1000
                    },
                    {
                        id: 'q3',
                        questionText: 'เมื่อเกิดสัญญาณเตือนภัยไหม้ สิ่งแรกที่ต้องทำคืออะไร?',
                        options: ['เก็บของส่วนตัวใส่กระเป๋า', 'เดินลงทางบันไดหนีไฟทันที', 'กดลิฟต์ลงชั้น 1', 'นั่งรอฟังประกาศต่อ'],
                        correctOption: 1,
                        timeLimit: 15,
                        points: 1000
                    }
                ]
            }
        ];

        // Web Audio Synthesizer สำหรับเสียงเอฟเฟกต์
        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'click') {
                    osc.frequency.setValueAtTime(400, ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.1);
                } else if (type === 'correct') {
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
                    osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, ctx.currentTime);
                    osc.frequency.setValueAtTime(150, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'count') {
                    osc.frequency.setValueAtTime(800, ctx.currentTime);
                    gain.gain.setValueAtTime(0.05, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.08);
                }
            } catch(e) {
                console.log("Audio play error", e);
            }
        };

        function App() {
            const [view, setView] = useState('HOME');
            const [quizzes, setQuizzes] = useState(() => {
                const saved = localStorage.getItem('company_kahoot_quizzes');
                return saved ? JSON.parse(saved) : DEFAULT_QUIZZES;
            });

            // Firebase Config State
            const [fbDatabaseUrl, setFbDatabaseUrl] = useState(() => {
                return localStorage.getItem('fb_db_url') || 'https://mycompany-kahoot-default-rtdb.asia-southeast1.firebasedatabase.app';
            });
            const [fbApiKey, setFbApiKey] = useState(() => {
                return localStorage.getItem('fb_api_key') || '';
            });
            const dbRef = useRef(null);

            // Admin Auth State
            const [isAdminAuth, setIsAdminAuth] = useState(false);
            const [passcodeInput, setPasscodeInput] = useState('');
            const [passcodeError, setPasscodeError] = useState('');

            // Backup & Google Drive Sync State
            const [showImportModal, setShowImportModal] = useState(false);
            const [importJsonText, setImportJsonText] = useState('');
            const [googleScriptUrl, setGoogleScriptUrl] = useState(() => {
                return localStorage.getItem('kahoot_google_script_url') || 'https://script.google.com/macros/s/AKfycbw-5N50clAOoW-CPQAW90UlKgmq0_9VFMZEoTb6HQrmeTAtSWTXLBJIwhf96g6t5uxc/exec';
            });
            const [isSyncingDrive, setIsSyncingDrive] = useState(false);
            const [driveSyncMessage, setDriveSyncMessage] = useState('');

            // Active Game Session State
            const [activeQuiz, setActiveQuiz] = useState(null);
            const [editingQuiz, setEditingQuiz] = useState(null);
            const [pinCode, setPinCode] = useState('');
            const [players, setPlayers] = useState([]);
            const [gameState, setGameState] = useState('LOBBY');
            const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
            const [currentQuestionData, setCurrentQuestionData] = useState(null);
            const [timeLeft, setTimeLeft] = useState(20);
            const [autoNextTime, setAutoNextTime] = useState(5);
            const [isSavingResults, setIsSavingResults] = useState(false);
            const [saveResultsMessage, setSaveResultsMessage] = useState('');

            // Player State
            const [playerName, setPlayerName] = useState('');
            const [joinedPin, setJoinedPin] = useState('');
            const [myPlayerId, setMyPlayerId] = useState('');
            const [hasAnswered, setHasAnswered] = useState(false);
            const [selectedOption, setSelectedOption] = useState(null);

            useEffect(() => {
                localStorage.setItem('company_kahoot_quizzes', JSON.stringify(quizzes));
            }, [quizzes]);

            useEffect(() => {
                localStorage.setItem('kahoot_google_script_url', googleScriptUrl);
            }, [googleScriptUrl]);

            useEffect(() => {
                localStorage.setItem('fb_db_url', fbDatabaseUrl);
                localStorage.setItem('fb_api_key', fbApiKey);
                
                try {
                    if (!firebase.apps.length) {
                        const config = {
                            databaseURL: fbDatabaseUrl,
                            apiKey: fbApiKey || "AIzaSyDummyKeyForTestingOnly"
                        };
                        firebase.initializeApp(config);
                    }
                    dbRef.current = firebase.database();
                } catch(e) {
                    console.log("Firebase init error", e);
                }
            }, [fbDatabaseUrl, fbApiKey]);

            // Real-time Listener for Player View (Subscribes to Host changes over Firebase)
            useEffect(() => {
                if (view === 'PLAYER_GAME' && joinedPin && dbRef.current) {
                    const roomRef = dbRef.current.ref('rooms/' + joinedPin);
                    
                    const handleValue = (snapshot) => {
                        const data = snapshot.val();
                        if (data) {
                            if (data.gameState) setGameState(data.gameState);
                            if (data.currentQuestionIndex !== undefined) setCurrentQuestionIndex(data.currentQuestionIndex);
                            if (data.timeLeft !== undefined) setTimeLeft(data.timeLeft);
                            if (data.currentQuestion) setCurrentQuestionData(data.currentQuestion);
                            if (data.autoNextTime !== undefined) setAutoNextTime(data.autoNextTime);
                            
                            if (data.gameState === 'QUESTION' && data.currentQuestionIndex !== currentQuestionIndex) {
                                setHasAnswered(false);
                                setSelectedOption(null);
                            }
                        }
                    };

                    roomRef.on('value', handleValue);
                    return () => roomRef.off('value', handleValue);
                }
            }, [view, joinedPin, currentQuestionIndex]);

            // Real-time Listener for Host View (Listens for Players joining/answering over Firebase)
            useEffect(() => {
                if (view.startsWith('HOST') && pinCode && dbRef.current) {
                    const playersRef = dbRef.current.ref('rooms/' + pinCode + '/players');
                    
                    const handlePlayers = (snapshot) => {
                        const data = snapshot.val();
                        if (data) {
                            const playerList = Object.keys(data).map(id => ({
                                id: id,
                                ...data[id]
                            }));
                            setPlayers(playerList);
                        } else {
                            setPlayers([]);
                        }
                    };

                    playersRef.on('value', handlePlayers);
                    return () => playersRef.off('value', handlePlayers);
                }
            }, [view, pinCode]);

            const syncRoomStateToFirebase = (newState, questionIdx, timerSecs, autoNextSecs = 5, customQuestion = null) => {
                if (!pinCode || !dbRef.current) return;
                const currentQ = customQuestion || activeQuiz?.questions[questionIdx];
                const payload = {
                    gameState: newState,
                    currentQuestionIndex: questionIdx,
                    timeLeft: timerSecs,
                    autoNextTime: autoNextSecs,
                    currentQuestion: currentQ ? {
                        questionText: currentQ.questionText,
                        options: currentQ.options
                    } : null
                };
                dbRef.current.ref('rooms/' + pinCode).update(payload);
            };

            const handleSaveResultsToGoogleDrive = async (overridePlayers = null) => {
                if (!googleScriptUrl || !activeQuiz) return;
                setIsSavingResults(true);
                setSaveResultsMessage('⏳ กำลังสร้างไฟล์ Google Sheet สรุปผลคะแนนลง Google Drive...');
                try {
                    const targetPlayers = overridePlayers || players;
                    const payload = {
                        action: 'SAVE_RESULTS',
                        quizTitle: activeQuiz.title,
                        questions: activeQuiz.questions,
                        players: targetPlayers.map(p => ({
                            name: p.name,
                            score: p.score || 0,
                            playerAnswers: p.answersHistory || {}
                        }))
                    };
                    await fetch(googleScriptUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    setSaveResultsMessage('✅ บันทึกสรุปผลเป็น Google Sheet ลง Google Drive เรียบร้อยแล้ว!');
                } catch (err) {
                    setSaveResultsMessage('❌ ไม่สามารถบันทึกสรุปผลลง Google Drive ได้');
                } finally {
                    setIsSavingResults(false);
                }
            };

            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (passcodeInput.trim() === ADMIN_PASSCODE.trim()) {
                    setIsAdminAuth(true);
                    setPasscodeError('');
                    setView('ADMIN_QUIZ_LIST');
                    playSound('correct');
                } else {
                    setPasscodeError('รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง');
                    playSound('wrong');
                }
            };

            const handleLogoutAdmin = () => {
                setIsAdminAuth(false);
                setPasscodeInput('');
                setView('HOME');
            };

            const handleCreateNewQuiz = () => {
                const newQ = {
                    id: 'quiz-' + Date.now(),
                    title: 'ชุดคำถามใหม่ (ยังไม่ได้ตั้งชื่อ)',
                    description: 'คำอธิบายชุดคำถาม...',
                    questions: []
                };
                setQuizzes([...quizzes, newQ]);
                setEditingQuiz(newQ);
                setView('ADMIN_QUIZ_EDIT');
            };

            const handleDeleteQuiz = (id) => {
                if (confirm('คุณแน่ใจหรือไม่ว่าต้องการลบชุดคำถามนี้?')) {
                    setQuizzes(quizzes.filter(q => q.id !== id));
                }
            };

            const handleExportBackup = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(quizzes, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", `kahoot_quizzes_backup_${Date.now()}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            };

            const handleImportBackup = () => {
                try {
                    const parsed = JSON.parse(importJsonText);
                    if (Array.isArray(parsed) && parsed.length > 0 && parsed[0].questions) {
                        setQuizzes(parsed);
                        setShowImportModal(false);
                        setImportJsonText('');
                        alert('✅ นำเข้าชุดคำถามสำเร็จแล้ว!');
                    } else {
                        alert('⚠️ รูปแบบข้อมูล JSON ไม่ถูกต้อง กรุณาตรวจสอบอีกครั้ง');
                    }
                } catch(e) {
                    alert('⚠️ เกิดข้อผิดพลาดในการอ่านโค้ด JSON กรุณาตรวจสอบความถูกต้อง');
                }
            };

            const handleSaveToGoogleDrive = async () => {
                if (!googleScriptUrl) return alert('กรุณาระบุ Google Script URL');
                setIsSyncingDrive(true);
                setDriveSyncMessage('กำลังบันทึกลง Google Drive...');
                try {
                    await fetch(googleScriptUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(quizzes)
                    });
                    setDriveSyncMessage('✅ บันทึกลง Drive เรียบร้อยแล้ว!');
                } catch (err) {
                    setDriveSyncMessage('❌ เกิดข้อผิดพลาดในการเชื่อมต่อ');
                } finally {
                    setIsSyncingDrive(false);
                    setTimeout(() => setDriveSyncMessage(''), 4000);
                }
            };

            const handleLoadFromGoogleDrive = async () => {
                if (!googleScriptUrl) return alert('กรุณาระบุ Google Script URL');
                setIsSyncingDrive(true);
                setDriveSyncMessage('กำลังดึงคำถามจาก Google Drive...');
                try {
                    const res = await fetch(googleScriptUrl);
                    const data = await res.json();
                    if (Array.isArray(data) && data.length > 0) {
                        setQuizzes(data);
                        setDriveSyncMessage('✅ ดึงข้อมูลคำถามสำเร็จ!');
                    } else {
                        setDriveSyncMessage('⚠️ ไม่พบชุดคำถามใน Drive');
                    }
                } catch (err) {
                    setDriveSyncMessage('❌ ไม่สามารถดึงข้อมูลจาก Drive ได้');
                } finally {
                    setIsSyncingDrive(false);
                    setTimeout(() => setDriveSyncMessage(''), 4000);
                }
            };

            const handleAddQuestion = () => {
                if (!editingQuiz) return;
                const newQuestion = {
                    id: 'q-' + Date.now(),
                    questionText: 'คำถามข้อใหม่...',
                    options: ['ตัวเลือก A', 'ตัวเลือก B', 'ตัวเลือก C', 'ตัวเลือก D'],
                    correctOption: 0,
                    timeLimit: 20,
                    points: 1000
                };
                const updated = {
                    ...editingQuiz,
                    questions: [...editingQuiz.questions, newQuestion]
                };
                setEditingQuiz(updated);
                setQuizzes(quizzes.map(q => q.id === updated.id ? updated : q));
            };

            const handleUpdateQuestion = (qIndex, field, value) => {
                if (!editingQuiz) return;
                const updatedQuestions = [...editingQuiz.questions];
                updatedQuestions[qIndex] = {
                    ...updatedQuestions[qIndex],
                    [field]: value
                };
                const updatedQuiz = { ...editingQuiz, questions: updatedQuestions };
                setEditingQuiz(updatedQuiz);
                setQuizzes(quizzes.map(q => q.id === updatedQuiz.id ? updatedQuiz : q));
            };

            const handleUpdateOption = (qIndex, optIndex, value) => {
                if (!editingQuiz) return;
                const updatedQuestions = [...editingQuiz.questions];
                const newOptions = [...updatedQuestions[qIndex].options];
                newOptions[optIndex] = value;
                updatedQuestions[qIndex].options = newOptions;

                const updatedQuiz = { ...editingQuiz, questions: updatedQuestions };
                setEditingQuiz(updatedQuiz);
                setQuizzes(quizzes.map(q => q.id === updatedQuiz.id ? updatedQuiz : q));
            };

            const handleDeleteQuestion = (qIndex) => {
                if (!editingQuiz) return;
                if (confirm('ยืนยันลบข้อคำถามนี้?')) {
                    const updatedQuestions = editingQuiz.questions.filter((_, idx) => idx !== qIndex);
                    const updatedQuiz = { ...editingQuiz, questions: updatedQuestions };
                    setEditingQuiz(updatedQuiz);
                    setQuizzes(quizzes.map(q => q.id === updatedQuiz.id ? updatedQuiz : q));
                }
            };

            const startHostLobby = (quiz) => {
                const randomPin = Math.floor(100000 + Math.random() * 900000).toString();
                setActiveQuiz(quiz);
                setPinCode(randomPin);
                setPlayers([]);
                setGameState('LOBBY');
                setView('HOST_LOBBY');

                if (dbRef.current) {
                    dbRef.current.ref('rooms/' + randomPin).set({
                        gameState: 'LOBBY',
                        currentQuestionIndex: 0,
                        timeLeft: 20,
                        quizTitle: quiz.title
                    });
                }
            };

            const addBotPlayer = () => {
                const botNames = ['สมชาย (IT)', 'วิภา (HR)', 'กิตติ (Sales)', 'อนันต์ (CEO)', 'ปรียา (Marketing)', 'นพดล (Dev)'];
                const randomName = botNames[Math.floor(Math.random() * botNames.length)] + ' ' + Math.floor(Math.random()*100);
                const botId = 'bot-' + Date.now() + '-' + Math.floor(Math.random()*1000);
                
                if (dbRef.current && pinCode) {
                    dbRef.current.ref('rooms/' + pinCode + '/players/' + botId).set({
                        name: randomName,
                        score: 0,
                        lastAnswer: null,
                        isBot: true,
                        answersHistory: {}
                    });
                }
                playSound('click');
            };

            const startFirstQuestion = () => {
                setCurrentQuestionIndex(0);
                setGameState('QUESTION');
                setView('HOST_GAME');
                const t = activeQuiz.questions[0]?.timeLimit || 20;
                setTimeLeft(t);
                syncRoomStateToFirebase('QUESTION', 0, t, 5);
            };

            useEffect(() => {
                let timerInterval = null;
                let autoNextInterval = null;

                if (view === 'HOST_GAME' && gameState === 'QUESTION') {
                    // Simulate bot answers
                    players.forEach(p => {
                        if (p.isBot && p.lastAnswer === null) {
                            if (Math.random() > 0.4) {
                                const randomAns = Math.floor(Math.random() * 4);
                                const remTime = Math.round(timeLeft * (0.3 + Math.random() * 0.6));
                                if (dbRef.current && pinCode) {
                                    const updatedHistory = { ...(p.answersHistory || {}), [currentQuestionIndex]: randomAns };
                                    dbRef.current.ref('rooms/' + pinCode + '/players/' + p.id).update({
                                        lastAnswer: randomAns,
                                        answerTime: remTime,
                                        answersHistory: updatedHistory
                                    });
                                }
                            }
                        }
                    });

                    timerInterval = setInterval(() => {
                        setTimeLeft(prev => {
                            if (prev <= 1) {
                                clearInterval(timerInterval);
                                evaluateCurrentQuestion();
                                return 0;
                            }
                            const nextT = prev - 1;
                            playSound('count');
                            syncRoomStateToFirebase('QUESTION', currentQuestionIndex, nextT, 5);
                            return nextT;
                        });
                    }, 1000);
                } else if (view === 'HOST_GAME' && gameState === 'RESULT') {
                    setAutoNextTime(5);
                    autoNextInterval = setInterval(() => {
                        setAutoNextTime(prev => {
                            if (prev <= 1) {
                                clearInterval(autoNextInterval);
                                goToNextQuestion();
                                return 0;
                            }
                            const nextAuto = prev - 1;
                            syncRoomStateToFirebase('RESULT', currentQuestionIndex, 0, nextAuto);
                            return nextAuto;
                        });
                    }, 1000);
                }

                return () => {
                    if (timerInterval) clearInterval(timerInterval);
                    if (autoNextInterval) clearInterval(autoNextInterval);
                };
            }, [view, gameState, currentQuestionIndex]);

            const evaluateCurrentQuestion = () => {
                setGameState('RESULT');
                setAutoNextTime(5);
                const currentQ = activeQuiz.questions[currentQuestionIndex];
                
                // Evaluate scores and update Firebase
                players.forEach(p => {
                    let earned = 0;
                    if (p.lastAnswer === currentQ.correctOption) {
                        const remTime = p.answerTime !== undefined && p.answerTime !== null ? p.answerTime : 1;
                        const totalLimit = currentQ.timeLimit || 20;
                        const timeRatio = Math.min(1, Math.max(0.1, remTime / totalLimit));
                        earned = Math.round(currentQ.points * timeRatio);
                    }
                    const newScore = (p.score || 0) + earned;
                    if (dbRef.current && pinCode) {
                        dbRef.current.ref('rooms/' + pinCode + '/players/' + p.id).update({
                            score: newScore,
                            lastEarned: earned
                        });
                    }
                });

                syncRoomStateToFirebase('RESULT', currentQuestionIndex, 0, 5);
            };

            const goToNextQuestion = () => {
                if (currentQuestionIndex + 1 < activeQuiz.questions.length) {
                    const nextIdx = currentQuestionIndex + 1;
                    setCurrentQuestionIndex(nextIdx);
                    
                    // Reset player last answers on Firebase
                    players.forEach(p => {
                        if (dbRef.current && pinCode) {
                            dbRef.current.ref('rooms/' + pinCode + '/players/' + p.id).update({
                                lastAnswer: null
                            });
                        }
                    });

                    setGameState('QUESTION');
                    const t = activeQuiz.questions[nextIdx]?.timeLimit || 20;
                    setTimeLeft(t);
                    syncRoomStateToFirebase('QUESTION', nextIdx, t, 5);
                } else {
                    setGameState('FINISHED');
                    syncRoomStateToFirebase('FINISHED', currentQuestionIndex, 0, 0);
                    confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
                    setTimeout(() => {
                        handleSaveResultsToGoogleDrive();
                    }, 500);
                }
            };

            const handlePlayerJoin = (e) => {
                e.preventDefault();

                                        </button>
                                    </div>

                                    <div className="flex flex-wrap justify-center gap-3 max-w-3xl mx-auto min-h-[120px] p-4 bg-slate-800/30 rounded-2xl border border-slate-800">
                                        {players.length === 0 ? (
                                            <p className="text-slate-500 my-auto text-sm">กำลังรอผู้เล่นเข้าร่วมห้องผ่าน Firebase Realtime...</p>
                                        ) : (
                                            players.map(p => (
                                                <div key={p.id} className="bg-purple-900/60 border border-purple-500/40 px-4 py-2 rounded-xl text-sm font-bold animate-bounce-short">
                                                    👤 {p.name}
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>

                                <button 
                                    onClick={startFirstQuestion}
                                    disabled={players.length === 0}
                                    className={`px-8 py-4 rounded-2xl font-black text-xl shadow-lg transition ${
                                        players.length > 0 ? 'bg-green-500 hover:bg-green-600 text-slate-900 cursor-pointer' : 'bg-slate-700 text-slate-500 cursor-not-allowed'
                                    }`}>
                                    🚀 เริ่มเล่นเกมเลย!
                                </button>
                            </div>
                        )}

                        {/* 6. HOST GAME VIEW */}
                        {}
                        {view === 'HOST_GAME' && activeQuiz && (
                            <div className="space-y-6">
                                <div className="flex justify-between items-center">
                                    <span className="font-bold text-purple-300">
                                        คำถามข้อที่ {currentQuestionIndex + 1} / {activeQuiz.questions.length}
                                    </span>
                                    <div className="w-16 h-16 bg-purple-600 rounded-full flex items-center justify-center font-black text-2xl border-4 border-purple-400">
                                        {timeLeft}
                                    </div>
                                </div>

                                <div className="bg-slate-800 border-2 border-slate-700 p-8 rounded-3xl text-center shadow-xl">
                                    <h2 className="text-2xl md:text-3xl font-black">
                                        {activeQuiz.questions[currentQuestionIndex]?.questionText}
                                    </h2>
                                </div>

                                <div className="grid grid-cols-2 gap-4">
                                    {activeQuiz.questions[currentQuestionIndex]?.options.map((opt, idx) => (
                                        <div 
                                            key={idx} 
                                            className={`${optionColors[idx]} p-5 rounded-2xl font-bold text-lg flex items-center gap-3 shadow-md ${
                                                gameState === 'RESULT' && idx === activeQuiz.questions[currentQuestionIndex].correctOption ? 'ring-4 ring-white' : ''
                                            }`}>
                                            <span className="text-2xl">{optionIcons[idx]}</span>
                                            <span>{opt}</span>
                                            {gameState === 'RESULT' && idx === activeQuiz.questions[currentQuestionIndex].correctOption && (
                                                <span className="ml-auto bg-white text-green-700 text-xs px-2 py-1 rounded-md">✓ คำตอบที่ถูก</span>
                                            )}
                                        </div>
                                    ))}
                                </div>

                                {gameState === 'RESULT' && (
                                    <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700 text-center space-y-5 shadow-2xl">
                                        <div className="flex justify-between items-center bg-purple-950/80 p-4 rounded-2xl border border-purple-500/30">
                                            <div className="text-left">
                                                <h3 className="text-xl font-black text-yellow-400">📊 ตารางสรุปคะแนนสะสม (จากสูงไปต่ำ)</h3>
                                                <p className="text-xs text-slate-400 mt-0.5">คะแนนสะสมจะถูกคำนวณตามความถูกต้องและความเร็วในการตอบ</p>
                                            </div>
                                            <span className="text-sm font-bold bg-purple-600 text-white px-4 py-1.5 rounded-full animate-pulse border border-purple-400 shrink-0">
                                                ⏱️ เริ่มข้อถัดไปใน {autoNextTime} วินาที...
                                            </span>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3 max-w-3xl mx-auto">
                                            {players.sort((a,b) => (b.score || 0) - (a.score || 0)).map((p, rank) => (
                                                <div key={p.id} className={`flex justify-between items-center p-3.5 rounded-xl font-bold text-sm ${
                                                    rank === 0 ? 'bg-yellow-500/20 text-yellow-300 border border-yellow-500/40 text-base' : 'bg-slate-900 text-slate-300'
                                                }`}>
                                                    <div className="flex items-center gap-2">
                                                        <span>{rank === 0 ? '🥇' : rank === 1 ? '🥈' : rank === 2 ? '🥉' : `#${rank + 1}`}</span>
                                                        <span>{p.name}</span>
                                                    </div>
                                                    <span className="text-yellow-400 font-extrabold">{p.score || 0} คะแนน</span>
                                                </div>
                                            ))}
                                        </div>

                                        <button 
                                            onClick={goToNextQuestion}
                                            className="bg-purple-600 hover:bg-purple-500 text-white font-bold px-8 py-3 rounded-xl shadow-lg transition active:scale-95">
                                            เริ่มข้อถัดไปทันที ➔
                                        </button>
                                    </div>
                                )}

                                {gameState === 'FINISHED' && (
                                    <div className="bg-slate-800 p-8 rounded-3xl border-2 border-yellow-500/50 text-center space-y-6">
                                        <h2 className="text-3xl font-black text-yellow-400">🏆 อันดับผู้ชนะตารางคะแนน 🏆</h2>
                                        
                                        {saveResultsMessage && (
                                            <div className="bg-purple-950/80 border border-purple-500/50 p-3 rounded-xl text-xs font-semibold text-purple-200 max-w-md mx-auto">
                                                {saveResultsMessage}
                                            </div>
                                        )}

                                        <div className="max-w-md mx-auto space-y-2">
                                            {players.sort((a,b) => (b.score || 0) - (a.score || 0)).map((p, idx) => (
                                                <div key={p.id} className={`flex justify-between p-3 rounded-xl font-bold ${
                                                    idx === 0 ? 'bg-yellow-500/20 text-yellow-300 border border-yellow-500/40 text-lg' : 'bg-slate-900 text-slate-300'
                                                }`}>
                                                    <span>#{idx+1} {p.name}</span>
                                                    <span>{p.score || 0} คะแนน</span>
                                                </div>
                                            ))}
                                        </div>

                                        <div className="flex justify-center gap-3">
                                            <button 
                                                onClick={() => handleSaveResultsToGoogleDrive()}
                                                disabled={isSavingResults}
                                                className="bg-green-600 hover:bg-green-500 font-bold px-5 py-3 rounded-xl text-sm flex items-center gap-2">
                                                📊 บันทึกผลลง Google Sheet อีกครั้ง
                                            </button>
                                            <button 
                                                onClick={() => setView('HOME')}
                                                className="bg-purple-600 hover:bg-purple-500 font-bold px-6 py-3 rounded-xl text-sm">
                                                กลับสู่หน้าหลัก
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* 7. PLAYER JOIN VIEW */}
                        {}
                        {view === 'PLAYER_JOIN' && (
                            <div className="max-w-md mx-auto bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-2xl">
                                <h2 className="text-2xl font-bold text-center mb-6 text-blue-400">เข้าร่วมเกมตอบคำถาม</h2>
                                <form onSubmit={handlePlayerJoin} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-400 mb-1">PIN Code (6 หลัก)</label>
                                        <input 
                                            type="number"
                                            value={joinedPin}
                                            onChange={(e) => setJoinedPin(e.target.value)}
                                            placeholder="กรอกรหัส PIN..."
                                            className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-center text-2xl font-black tracking-widest text-yellow-400 focus:outline-none focus:border-blue-500"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-400 mb-1">ชื่อพนักงาน / Nickname</label>
                                        <input 
                                            type="text"
                                            value={playerName}
                                            onChange={(e) => setPlayerName(e.target.value)}
                                            placeholder="ระบุชื่อของคุณ..."
                                            className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-center font-bold text-white focus:outline-none focus:border-blue-500"
                                        />
                                    </div>
                                    <button 
                                        type="submit"
                                        className="w-full bg-blue-600 hover:bg-blue-500 font-bold py-3.5 rounded-xl text-lg shadow-lg">
                                        เข้าร่วมเลย ➔
                                    </button>
                                </form>
                            </div>
                        )}

                        {/* 8. PLAYER GAME VIEW */}
                        {}
                        {view === 'PLAYER_GAME' && (
                            <div className="max-w-md mx-auto text-center space-y-6">
                                <div className="bg-slate-800 p-4 rounded-2xl border border-slate-700 flex justify-between items-center">
                                    <div>
                                        <span className="text-xs text-slate-400">ผู้เล่น:</span>
                                        <span className="font-bold text-blue-300 ml-2">{playerName}</span>
                                    </div>
                                    {gameState === 'QUESTION' && (
                                        <span className="bg-purple-600 text-white font-black text-sm px-3 py-1 rounded-full animate-pulse border border-purple-400">
                                            ⏱️ {timeLeft}s
                                        </span>
                                    )}
                                </div>

                                {gameState === 'LOBBY' && (
                                    <div className="py-12 bg-slate-800/40 rounded-3xl border border-dashed border-slate-700">
                                        <div className="text-4xl mb-3">⏳</div>
                                        <h3 className="font-bold text-lg">เข้าร่วมห้องเรียบร้อย!</h3>
                                        <p className="text-slate-400 text-sm mt-1">รอดูกระดานโปรเจกเตอร์และรอวิทยากรเริ่มเกม...</p>
                                    </div>
                                )}

                                {gameState === 'QUESTION' && (
                                    <div className="space-y-4">
                                        {currentQuestionData?.questionText && (
                                            <div className="bg-slate-800 border border-slate-700 p-4 rounded-2xl font-bold text-base text-yellow-300">
                                                {currentQuestionData.questionText}
                                            </div>
                                        )}
                                        <p className="text-xs font-semibold text-slate-400">เลือกคำตอบที่ถูกต้องบนจอมือถือของคุณ:</p>
                                        <div className="grid grid-cols-1 gap-3">
                                            {[0, 1, 2, 3].map((optIdx) => {
                                                const optionText = currentQuestionData?.options?.[optIdx] || `ตัวเลือก ${optIdx + 1}`;
                                                return (
                                                    <button 
                                                        key={optIdx}
                                                        onClick={() => handleAnswerSubmit(optIdx)}
                                                        disabled={hasAnswered}
                                                        className={`${optionColors[optIdx]} p-4 rounded-2xl font-bold text-base flex items-center justify-between shadow-lg transition active:scale-95 ${
                                                            hasAnswered && selectedOption === optIdx ? 'ring-4 ring-white scale-105' : ''
                                                        } ${hasAnswered && selectedOption !== optIdx ? 'opacity-40 grayscale' : ''}`}>
                                                        <span className="text-2xl font-black">{optionIcons[optIdx]}</span>
                                                        <span className="text-sm font-semibold flex-1 text-center px-2">{optionText}</span>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                        {hasAnswered && (
                                            <div className="p-3 bg-green-950/80 border border-green-500/40 text-green-300 rounded-xl text-xs font-bold">
                                                🔒 ล็อกคำตอบเรียบร้อยแล้ว! รอวิทยากรเฉลย...
                                            </div>
                                        )}
                                    </div>
                                )}

                                {(gameState === 'RESULT' || gameState === 'FINISHED') && (
                                    <div className="py-8 bg-slate-800 rounded-3xl border border-slate-700 space-y-4">
                                        <h3 className="font-bold text-xl text-yellow-400">สรุปผลคะแนนประจำข้อนี้</h3>
                                        <p className="text-slate-400 text-xs">โปรดดูผลคะแนนสะสมและเฉลยบนหน้าจอวิทยากร</p>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* IMPORT MODAL */}
                        {}
                        {showImportModal && (
                            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
                                <div className="bg-slate-800 border border-slate-700 p-6 rounded-2xl max-w-lg w-full space-y-4">
                                    <h3 className="text-lg font-bold text-purple-300">📤 นำเข้าข้อมูลชุดคำถาม (Import JSON)</h3>
                                    <p className="text-xs text-slate-400">วางโค้ดข้อความ JSON ที่ได้จากไฟล์สำรองข้อมูลเพื่อกู้คืนชุดคำถามทั้งหมด:</p>
                                    <textarea 
                                        rows="6"
                                        value={importJsonText}
                                        onChange={(e) => setImportJsonText(e.target.value)}
                                        placeholder="วางโค้ด JSON ที่นี่..."
                                        className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs font-mono text-slate-200 focus:outline-none focus:border-purple-500"
                                    />
                                    <div className="flex justify-end gap-2">
                                        <button 
                                            onClick={() => setShowImportModal(false)}
                                            className="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-xl text-xs font-semibold">
                                            ยกเลิก
                                        </button>
                                        <button 
                                            onClick={handleImportBackup}
                                            className="bg-purple-600 hover:bg-purple-500 px-4 py-2 rounded-xl text-xs font-bold">
                                            ยืนยันนำเข้าข้อมูล
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                    </main>

                    {/* Footer */}
                    {}
                    <footer className="text-center text-xs text-slate-600 py-4 border-t border-slate-800">
                        Corporate Quiz App • สำหรับใช้จัดกิจกรรมภายในบริษัท
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
