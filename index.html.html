<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Quiz App - Kahoot Style with Google Drive Sync</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Kanit', sans-serif;
            user-select: none;
        }
        .animate-bounce-short {
            animation: bounce 0.5s ease-in-out 2;
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // รหัสผ่านสำหรับเข้าสู่ระบบ Admin
        const ADMIN_PASSCODE = "QCKNT10520";

        // คลังชุดคำถามเริ่มต้นกรณีไม่มีใน LocalStorage
        const DEFAULT_QUIZZES = [
            {
                id: 'default-1',
                title: 'ความรู้ทั่วไปองค์กร & ความปลอดภัย',
                description: 'ทดสอบความเข้าใจนโยบายบริษัทและการทำงานปลอดภัย',
                questions: [
                    {
                        id: 'q1',
                        questionText: 'วิvision ของบริษัทเราเน้นเรื่องใดเป็นสำคัญที่สุด?',
                        options: ['กำไรสูงสุด', 'นวัตกรรมและความยั่งยืน', 'ขยายสาขาต่างประเทศ', 'ลดต้นทุนผลิต'],
                        correctOption: 1,
                        timeLimit: 20,
                        points: 1000
                    },
                    {
                        id: 'q2',
                        questionText: 'เบอร์โทรศัพท์ฉุกเฉินสำหรับแจ้งเหตุภายในออฟฟิศคือเบอร์อะไร?',
                        options: ['กด 0', 'กด 100', 'กด 999', 'กด 1193'],
                        correctOption: 2,
                        timeLimit: 15,
                        points: 1000
                    },
                    {
                        id: 'q3',
                        questionText: 'เมื่อเกิดสัญญาณเตือนภัยไหม้ สิ่งแรกที่ต้องทำคืออะไร?',
                        options: ['เก็บของส่วนตัวใส่กระเป๋า', 'เดินลงทางบันไดหนีไฟทันที', 'กดลิฟต์ลงชั้น 1', 'นั่งรอฟังประกาศต่อ'],
                        correctOption: 1,
                        timeLimit: 15,
                        points: 1000
                    }
                ]
            }
        ];

        // Web Audio Synthesizer สำหรับเสียงเอฟเฟกต์
        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'click') {
                    osc.frequency.setValueAtTime(400, ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.1);
                } else if (type === 'correct') {
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
                    osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, ctx.currentTime);
                    osc.frequency.setValueAtTime(150, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'count') {
                    osc.frequency.setValueAtTime(800, ctx.currentTime);
                    gain.gain.setValueAtTime(0.05, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.08);
                }
            } catch(e) {
                console.log("Audio play error", e);
            }
        };

        function App() {
            const [view, setView] = useState('HOME'); // HOME, HOST_LOBBY, HOST_GAME, PLAYER_JOIN, PLAYER_GAME, ADMIN_LOGIN, ADMIN_QUIZ_LIST, ADMIN_QUIZ_EDIT
            const [quizzes, setQuizzes] = useState(() => {
                const saved = localStorage.getItem('company_kahoot_quizzes');
                return saved ? JSON.parse(saved) : DEFAULT_QUIZZES;
            });

            // Admin Auth State
            const [isAdminAuth, setIsAdminAuth] = useState(false);
            const [passcodeInput, setPasscodeInput] = useState('');
            const [passcodeError, setPasscodeError] = useState('');

            // Backup, Import & Google Drive Sync State
            const [showImportModal, setShowImportModal] = useState(false);
            const [importJsonText, setImportJsonText] = useState('');
            const [googleScriptUrl, setGoogleScriptUrl] = useState(() => {
                return localStorage.getItem('kahoot_google_script_url') || 'https://script.google.com/macros/s/AKfycbzXMe31YiBlE698tvRnsfvXPexD4j4fBaJyJ4ZAx2gT_D67yu76P_owUks3bUBHC00M/exec';
            });
            const [isSyncingDrive, setIsSyncingDrive] = useState(false);
            const [driveSyncMessage, setDriveSyncMessage] = useState('');

            // Active Game Session State
            const [activeQuiz, setActiveQuiz] = useState(null);
            const [editingQuiz, setEditingQuiz] = useState(null);
            const [pinCode, setPinCode] = useState('');
            const [players, setPlayers] = useState([]);
            const [gameState, setGameState] = useState('LOBBY');
            const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
            const [timeLeft, setTimeLeft] = useState(20);
            const [autoNextTime, setAutoNextTime] = useState(5);

            // Player State
            const [playerName, setPlayerName] = useState('');
            const [joinedPin, setJoinedPin] = useState('');
            const [myPlayerId, setMyPlayerId] = useState('');
            const [hasAnswered, setHasAnswered] = useState(false);
            const [selectedOption, setSelectedOption] = useState(null);
            const [currentQuestionData, setCurrentQuestionData] = useState(null);

            // Real-time Broadcast Sync Channel
            const channelRef = useRef(null);

            useEffect(() => {
                localStorage.setItem('company_kahoot_quizzes', JSON.stringify(quizzes));
            }, [quizzes]);

            useEffect(() => {
                localStorage.setItem('kahoot_google_script_url', googleScriptUrl);
            }, [googleScriptUrl]);

            useEffect(() => {
                channelRef.current = new BroadcastChannel('kahoot_game_channel');
                channelRef.current.onmessage = (event) => {
                    const data = event.data;
                    if (data.type === 'SYNC_GAME') {
                        setGameState(data.gameState);
                        setCurrentQuestionIndex(data.currentQuestionIndex);
                        setTimeLeft(data.timeLeft);
                        if (data.autoNextTime !== undefined) setAutoNextTime(data.autoNextTime);
                        if (data.questionData) {
                            setCurrentQuestionData(data.questionData);
                        }
                        if (data.gameState === 'QUESTION') {
                            setHasAnswered(false);
                            setSelectedOption(null);
                        }
                    } else if (data.type === 'PLAYER_JOINED' && view.startsWith('HOST')) {
                        setPlayers(prev => {
                            if (prev.find(p => p.name === data.name)) return prev;
                            return [...prev, { id: data.id, name: data.name, score: 0, lastAnswer: null, answerTime: 0 }];
                        });
                    } else if (data.type === 'PLAYER_SUBMIT_ANSWER' && view.startsWith('HOST')) {
                        setPlayers(prev => prev.map(p => {
                            if (p.id === data.playerId) {
                                return { ...p, lastAnswer: data.optionIndex, answerTime: data.timeTaken };
                            }
                            return p;
                        }));
                    }
                };

                return () => {
                    if (channelRef.current) channelRef.current.close();
                };
            }, [view]);

            // บรอดแคสต์สถานะเกมไปยังผู้เล่น
            const broadcastGameState = (newState, questionIdx, timer, autoNext = 5) => {
                if (channelRef.current) {
                    channelRef.current.postMessage({
                        type: 'SYNC_GAME',
                        gameState: newState,
                        currentQuestionIndex: questionIdx,
                        timeLeft: timer,
                        autoNextTime: autoNext,
                        questionData: activeQuiz?.questions[questionIdx] || null
                    });
                }
            };

            // --- ADMIN HANDLERS ---
            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (passcodeInput.trim() === ADMIN_PASSCODE.trim()) {
                    setIsAdminAuth(true);
                    setPasscodeError('');
                    setView('ADMIN_QUIZ_LIST');
                    playSound('correct');
                } else {
                    setPasscodeError('รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง');
                    playSound('wrong');
                }
            };

            const handleLogoutAdmin = () => {
                setIsAdminAuth(false);
                setPasscodeInput('');
                setView('HOME');
            };

            const handleCreateNewQuiz = () => {
                const newQ = {
                    id: 'quiz-' + Date.now(),
                    title: 'ชุดคำถามใหม่ (ยังไม่ได้ตั้งชื่อ)',
                    description: 'คำอธิบายชุดคำถาม...',
                    questions: []
                };
                setQuizzes([...quizzes, newQ]);
                setEditingQuiz(newQ);
                setView('ADMIN_QUIZ_EDIT');
            };

            const handleDeleteQuiz = (id) => {
                if (confirm('คุณแน่ใจหรือไม่ว่าต้องการลบชุดคำถามนี้?')) {
                    setQuizzes(quizzes.filter(q => q.id !== id));
                }
            };

            // --- BACKUP & RESTORE HANDLERS ---
            const handleExportBackup = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(quizzes, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", `kahoot_quizzes_backup_${Date.now()}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            };

            const handleImportBackup = () => {
                try {
                    const parsed = JSON.parse(importJsonText);
                    if (Array.isArray(parsed) && parsed.length > 0 && parsed[0].questions) {
                        setQuizzes(parsed);
                        setShowImportModal(false);
                        setImportJsonText('');
                        alert('✅ นำเข้าชุดคำถามสำเร็จแล้ว!');
                    } else {
                        alert('⚠️ รูปแบบข้อมูล JSON ไม่ถูกต้อง กรุณาตรวจสอบอีกครั้ง');
                    }
                } catch(e) {
                    alert('⚠️ เกิดข้อผิดพลาดในการอ่านโค้ด JSON กรุณาตรวจสอบความถูกต้อง');
                }
            };

            // --- QUESTION MANAGER HANDLERS ---
            const handleAddQuestion = () => {
                if (!editingQuiz) return;
                const newQuestion = {
                    id: 'q-' + Date.now(),
                    questionText: 'คำถามข้อใหม่...',
                    options: ['ตัวเลือก A', 'ตัวเลือก B', 'ตัวเลือก C', 'ตัวเลือก D'],
                    correctOption: 0,
                    timeLimit: 20,
                    points: 1000
                };
                const updated = {
                    ...editingQuiz,
                    questions: [...editingQuiz.questions, newQuestion]
                };
                setEditingQuiz(updated);
                setQuizzes(quizzes.map(q => q.id === updated.id ? updated : q));
            };

            const handleUpdateQuestion = (qIndex, field, value) => {
                if (!editingQuiz) return;
                const updatedQuestions = [...editingQuiz.questions];
                updatedQuestions[qIndex] = {
                    ...updatedQuestions[qIndex],
                    [field]: value
                };
                const updatedQuiz = { ...editingQuiz, questions: updatedQuestions };
                setEditingQuiz(updatedQuiz);
                setQuizzes(quizzes.map(q => q.id === updatedQuiz.id ? updatedQuiz : q));
            };

            const handleUpdateOption = (qIndex, optIndex, value) => {
                if (!editingQuiz) return;
                const updatedQuestions = [...editingQuiz.questions];
                const newOptions = [...updatedQuestions[qIndex].options];
                newOptions[optIndex] = value;
                updatedQuestions[qIndex].options = newOptions;

                const updatedQuiz = { ...editingQuiz, questions: updatedQuestions };
                setEditingQuiz(updatedQuiz);
                setQuizzes(quizzes.map(q => q.id === updatedQuiz.id ? updatedQuiz : q));
            };

            const handleDeleteQuestion = (qIndex) => {
                if (!editingQuiz) return;
                if (confirm('ยืนยันลบข้อคำถามนี้?')) {
                    const updatedQuestions = editingQuiz.questions.filter((_, idx) => idx !== qIndex);
                    const updatedQuiz = { ...editingQuiz, questions: updatedQuestions };
                    setEditingQuiz(updatedQuiz);
                    setQuizzes(quizzes.map(q => q.id === updatedQuiz.id ? updatedQuiz : q));
                }
            };

            // --- HOST GAME LOGIC ---
            const startHostLobby = (quiz) => {
                const randomPin = Math.floor(100000 + Math.random() * 900000).toString();
                setActiveQuiz(quiz);
                setPinCode(randomPin);
                setPlayers([]);
                setGameState('LOBBY');
                setView('HOST_LOBBY');
            };

            const addBotPlayer = () => {
                const botNames = ['สมชาย (IT)', 'วิภา (HR)', 'กิตติ (Sales)', 'อนันต์ (CEO)', 'ปรียา (Marketing)', 'นพดล (Dev)'];
                const randomName = botNames[Math.floor(Math.random() * botNames.length)] + ' ' + Math.floor(Math.random()*100);
                const botObj = {
                    id: 'bot-' + Date.now() + '-' + Math.random(),
                    name: randomName,
                    score: 0,
                    lastAnswer: null,
                    isBot: true
                };
                setPlayers(prev => [...prev, botObj]);
                playSound('click');
            };

            const startFirstQuestion = () => {
                setCurrentQuestionIndex(0);
                setGameState('QUESTION');
                setView('HOST_GAME');
                const t = activeQuiz.questions[0]?.timeLimit || 20;
                setTimeLeft(t);
                broadcastGameState('QUESTION', 0, t, 5);
            };

            useEffect(() => {
                let timerInterval = null;
                let autoNextInterval = null;

                if (view === 'HOST_GAME' && gameState === 'QUESTION') {
                    players.forEach(p => {
                        if (p.isBot && p.lastAnswer === null) {
                            if (Math.random() > 0.4) {
                                const randomAns = Math.floor(Math.random() * 4);
                                p.lastAnswer = randomAns;
                                p.answerTime = Math.round(timeLeft * (0.3 + Math.random() * 0.6));
                            }
                        }
                    });

                    timerInterval = setInterval(() => {
                        setTimeLeft(prev => {
                            if (prev <= 1) {
                                clearInterval(timerInterval);
                                evaluateCurrentQuestion();
                                return 0;
                            }
                            const nextT = prev - 1;
                            playSound('count');
                            broadcastGameState('QUESTION', currentQuestionIndex, nextT, 5);
                            return nextT;
                        });
                    }, 1000);
                } else if (view === 'HOST_GAME' && gameState === 'RESULT') {
                    setAutoNextTime(5);
                    autoNextInterval = setInterval(() => {
                        setAutoNextTime(prev => {
                            if (prev <= 1) {
                                clearInterval(autoNextInterval);
                                goToNextQuestion();
                                return 0;
                            }
                            const nextAuto = prev - 1;
                            broadcastGameState('RESULT', currentQuestionIndex, 0, nextAuto);
                            return nextAuto;
                        });
                    }, 1000);
                }

                return () => {
                    if (timerInterval) clearInterval(timerInterval);
                    if (autoNextInterval) clearInterval(autoNextInterval);
                };
            }, [view, gameState, currentQuestionIndex]);

            const evaluateCurrentQuestion = () => {
                setGameState('RESULT');
                setAutoNextTime(5);
                const currentQ = activeQuiz.questions[currentQuestionIndex];
                
                // คำนวณคะแนนผู้เล่นทุกคน: แปรผันตรงกับเวลาที่เหลืออยู่ขณะตอบ
                setPlayers(prev => prev.map(p => {
                    if (p.lastAnswer === currentQ.correctOption) {
                        const remTime = p.answerTime !== undefined && p.answerTime !== null ? p.answerTime : 1;
                        const totalLimit = currentQ.timeLimit || 20;
                        const timeRatio = Math.min(1, Math.max(0.1, remTime / totalLimit));
                        const earned = Math.round(currentQ.points * timeRatio);
                        return { ...p, score: p.score + earned };
                    }
                    return p;
                }));

                broadcastGameState('RESULT', currentQuestionIndex, 0, 5);
            };

            const goToNextQuestion = () => {
                if (currentQuestionIndex + 1 < activeQuiz.questions.length) {
                    const nextIdx = currentQuestionIndex + 1;
                    setCurrentQuestionIndex(nextIdx);
                    setPlayers(prev => prev.map(p => ({ ...p, lastAnswer: null })));
                    setGameState('QUESTION');
                    const t = activeQuiz.questions[nextIdx]?.timeLimit || 20;
                    setTimeLeft(t);
                    broadcastGameState('QUESTION', nextIdx, t, 5);
                } else {
                    setGameState('FINISHED');
                    broadcastGameState('FINISHED', currentQuestionIndex, 0, 0);
                    confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
                }
            };

            // --- PLAYER JOIN HANDLERS ---
            const handlePlayerJoin = (e) => {
                e.preventDefault();
                if (!playerName.trim() || !joinedPin.trim()) return alert('กรุณากรอก PIN และชื่อของคุณ');
                
                const myId = 'p-' + Date.now();
                setMyPlayerId(myId);
                setView('PLAYER_GAME');
                
                if (channelRef.current) {
                    channelRef.current.postMessage({
                        type: 'PLAYER_JOINED',
                        id: myId,
                        name: playerName
                    });
                }
                playSound('correct');
            };

            const handleAnswerSubmit = (optionIndex) => {
                if (hasAnswered || gameState !== 'QUESTION') return;
                setHasAnswered(true);
                setSelectedOption(optionIndex);
                playSound('click');

                if (channelRef.current) {
                    channelRef.current.postMessage({
                        type: 'PLAYER_SUBMIT_ANSWER',
                        playerId: myPlayerId,
                        optionIndex: optionIndex,
                        timeTaken: timeLeft
                    });
                }
            };

            const optionColors = [
                'bg-red-600 hover:bg-red-700 text-white',
                'bg-blue-600 hover:bg-blue-700 text-white',
                'bg-yellow-500 hover:bg-yellow-600 text-white',
                'bg-green-600 hover:bg-green-700 text-white'
            ];
            const optionIcons = ['▲', '◆', '●', '■'];

            return (
                <div className="min-h-screen flex flex-col justify-between p-4 max-w-6xl mx-auto">
                    {/* Header Bar */}
                    <header className="flex justify-between items-center py-3 border-b border-slate-800">
                        <div className="flex items-center gap-2 cursor-pointer" onClick={() => setView('HOME')}>
                            <div className="bg-purple-600 p-2 rounded-lg font-black text-xl tracking-wider">QCK</div>
                            <span className="font-bold text-xl bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">
                                Corporate Quiz App
                            </span>
                        </div>

                        <div className="flex gap-2">
                            {isAdminAuth ? (
                                <div className="flex items-center gap-2">
                                    <span className="text-xs bg-green-500/20 text-green-400 px-3 py-1 rounded-full border border-green-500/30 flex items-center gap-1">
                                        🔓 Admin Login อยู่
                                    </span>
                                    <button 
                                        onClick={() => setView('ADMIN_QUIZ_LIST')}
                                        className="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700">
                                        จัดการชุดคำถาม
                                    </button>
                                    <button 
                                        onClick={handleLogoutAdmin}
                                        className="text-xs bg-red-600/80 hover:bg-red-600 px-3 py-1.5 rounded-lg">
                                        ออกจากระบบ
                                    </button>
                                </div>
                            ) : (
                                <button 
                                    onClick={() => setView('ADMIN_LOGIN')}
                                    className="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 text-slate-300 flex items-center gap-1">
                                    🔒 สำหรับแอดมิน (สร้างคำถาม)
                                </button>
                            )}
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="my-auto py-6">
                        
                        {/* 1. HOME VIEW */}
                        {view === 'HOME' && (
                            <div className="text-center max-w-2xl mx-auto space-y-8">
                                <div>
                                    <h1 className="text-4xl md:text-5xl font-black mb-3 bg-gradient-to-r from-yellow-400 via-pink-500 to-purple-500 bg-clip-text text-transparent">
                                        พร้อมสนุกกับการทดสอบความรู้หรือยัง?
                                    </h1>
                                    <p className="text-slate-400 text-lg">
                                        เลือกโหมดการใช้งานสำหรับวิทยากรผู้นำเสนอ หรือพนักงานเข้าร่วมตอบคำถาม
                                    </p>
                                </div>

                                <div className="grid md:grid-cols-2 gap-4">
                                    <div 
                                        onClick={() => {
                                            if(quizzes.length > 0) startHostLobby(quizzes[0]);
                                            else alert('ยังไม่มีชุดคำถาม กรุณาเข้าสู่ระบบ Admin เพื่อเพิ่มคำถาม');
                                        }}
                                        className="bg-slate-800/80 hover:bg-purple-900/40 border-2 border-purple-500/30 hover:border-purple-500 p-6 rounded-2xl cursor-pointer transition transform hover:-translate-y-1 text-left group">
                                        <div className="text-3xl mb-2">📺</div>
                                        <h3 className="text-xl font-bold group-hover:text-purple-300">เป็นวิทยากร (Host)</h3>
                                        <p className="text-slate-400 text-sm mt-1">เปิดหน้าจอนี้ขึ้นโปรเจกเตอร์เพื่อสร้างห้องเล่นเกมกับทีมงาน</p>
                                    </div>

                                    <div 
                                        onClick={() => setView('PLAYER_JOIN')}

                            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                                <div className="bg-slate-800 border border-slate-700 p-6 rounded-2xl max-w-lg w-full space-y-4">
                                    <h3 className="text-xl font-bold text-purple-300">📤 นำเข้าชุดคำถาม (Restore Backup)</h3>
                                    <p className="text-xs text-slate-400">วางข้อความ JSON ที่ได้จากการ Export หรือสำรองข้อมูลไว้ลงในช่องด้านล่างนี้:</p>
                                    
                                    <textarea 
                                        rows="8"
                                        value={importJsonText}
                                        onChange={(e) => setImportJsonText(e.target.value)}
                                        placeholder="วางข้อความ JSON ที่นี่..."
                                        className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs font-mono text-slate-300 focus:outline-none focus:border-purple-500"
                                    ></textarea>

                                    <div className="flex justify-end gap-2">
                                        <button 
                                            onClick={() => setShowImportModal(false)}
                                            className="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-xl text-xs font-bold">
                                            ยกเลิก
                                        </button>
                                        <button 
                                            onClick={handleImportBackup}
                                            className="bg-purple-600 hover:bg-purple-500 px-4 py-2 rounded-xl text-xs font-bold">
                                            นำเข้าข้อมูลทันที
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 7. PLAYER JOIN FORM */}
                        {view === 'PLAYER_JOIN' && (
                            <div className="max-w-md mx-auto bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-2xl">
                                <h2 className="text-2xl font-bold text-center mb-6 text-blue-400">เข้าร่วมเกมตอบคำถาม</h2>
                                <form onSubmit={handlePlayerJoin} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-400 mb-1">PIN Code (6 หลัก)</label>
                                        <input 
                                            type="number"
                                            value={joinedPin}
                                            onChange={(e) => setJoinedPin(e.target.value)}
                                            placeholder="กรอกรหัส PIN..."
                                            className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-center text-2xl font-black tracking-widest text-yellow-400 focus:outline-none focus:border-blue-500"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-400 mb-1">ชื่อพนักงาน / Nickname</label>
                                        <input 
                                            type="text"
                                            value={playerName}
                                            onChange={(e) => setPlayerName(e.target.value)}
                                            placeholder="ระบุชื่อของคุณ..."
                                            className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-center font-bold text-white focus:outline-none focus:border-blue-500"
                                        />
                                    </div>
                                    <button 
                                        type="submit"
                                        className="w-full bg-blue-600 hover:bg-blue-500 font-bold py-3.5 rounded-xl text-lg shadow-lg">
                                        เข้าร่วมเลย ➔
                                    </button>
                                </form>
                            </div>
                        )}

                        {/* 8. PLAYER GAME VIEW (MOBILE BUTTONS) */}
                        {view === 'PLAYER_GAME' && (
                            <div className="max-w-md mx-auto text-center space-y-6">
                                <div className="bg-slate-800 p-4 rounded-2xl border border-slate-700 flex justify-between items-center">
                                    <div>
                                        <span className="text-xs text-slate-400">ผู้เล่น:</span>
                                        <span className="font-bold text-blue-300 ml-2">{playerName}</span>
                                    </div>
                                    {gameState === 'QUESTION' && (
                                        <div className="bg-purple-600 px-3 py-1 rounded-full text-white font-black text-sm animate-pulse flex items-center gap-1">
                                            ⏱️ {timeLeft}s
                                        </div>
                                    )}
                                </div>

                                {gameState === 'LOBBY' && (
                                    <div className="py-12 bg-slate-800/40 rounded-3xl border border-dashed border-slate-700">
                                        <div className="text-4xl mb-3">⏳</div>
                                        <h3 className="font-bold text-lg">เข้าร่วมห้องเรียบร้อย!</h3>
                                        <p className="text-slate-400 text-sm mt-1">รอดูกระดานโปรเจกเตอร์และรอวิทยากรเริ่มเกม...</p>
                                    </div>
                                )}

                                {gameState === 'QUESTION' && (
                                    <div className="space-y-4">
                                        {currentQuestionData && (
                                            <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center mb-2 shadow-inner">
                                                <div className="flex justify-between items-center mb-1">
                                                    <span className="text-xs text-purple-400 font-bold">คำถามข้อที่ {currentQuestionIndex + 1}</span>
                                                    <span className="text-xs text-yellow-400 font-bold">⏱️ เหลือ {timeLeft} วินาที</span>
                                                </div>
                                                <p className="font-bold text-base text-white">{currentQuestionData.questionText}</p>
                                            </div>
                                        )}
                                        <p className="text-xs font-semibold text-slate-400">เลือกคำตอบที่ถูกต้องบนจอมือถือของคุณ:</p>
                                        <div className="grid grid-cols-1 gap-3">
                                            {[0, 1, 2, 3].map((optIdx) => (
                                                <button 
                                                    key={optIdx}
                                                    onClick={() => handleAnswerSubmit(optIdx)}
                                                    disabled={hasAnswered}
                                                    className={`${optionColors[optIdx]} min-h-[60px] p-4 rounded-2xl font-bold text-base md:text-lg flex items-center justify-start gap-3 shadow-lg transition active:scale-95 text-left ${
                                                        hasAnswered && selectedOption === optIdx ? 'ring-4 ring-white' : ''
                                                    } ${hasAnswered && selectedOption !== optIdx ? 'opacity-30' : ''}`}>
                                                    <span className="text-2xl font-black shrink-0 w-8 text-center">{optionIcons[optIdx]}</span>
                                                    <span className="break-words">
                                                        {currentQuestionData && currentQuestionData.options[optIdx] 
                                                            ? currentQuestionData.options[optIdx] 
                                                            : `ตัวเลือก ${optIdx + 1}`}
                                                    </span>
                                                </button>
                                            ))}
                                        </div>
                                        {hasAnswered && (
                                            <p className="text-xs text-green-400 font-medium mt-2">✓ บันทึกคำตอบของคุณแล้ว (คำนวณคะแนนตามเวลาที่เหลืออยู่)</p>
                                        )}
                                    </div>
                                )}

                                {(gameState === 'RESULT' || gameState === 'FINISHED') && (
                                    <div className="py-12 bg-slate-800 rounded-3xl border border-slate-700 space-y-3">
                                        <h3 className="font-bold text-xl text-yellow-400">จบข้อนี้แล้ว!</h3>
                                        {gameState === 'RESULT' && (
                                            <p className="text-sm text-purple-300 font-semibold animate-pulse">
                                                กำลังเปลี่ยนไปข้อถัดไปอัตโนมัติใน {autoNextTime} วินาที...
                                            </p>
                                        )}
                                        <p className="text-slate-400 text-xs">โปรดดูผลคะแนนบนหน้าจอวิทยากร</p>
                                    </div>
                                )}
                            </div>
                        )}

                    </main>

                    {/* Footer */}
                    <footer className="text-center text-xs text-slate-600 py-4 border-t border-slate-800">
                        Corporate Quiz App • สำหรับใช้จัดกิจกรรมภายในบริษัท
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
